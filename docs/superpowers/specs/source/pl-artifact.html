const AIR={};
function riskOf(d){
  const p=computePL(d), r=p.giavon?p.laigop_cuoi/p.giavon:0, f=[], add=(pt,t,lv)=>f.push({pt,t,lv:lv||(pt>=15?'bad':'warn')});
  if(r<p.nguong) add(35,`LN thuần ${pct(r)} giá vốn, dưới ngưỡng ${pct(p.nguong)}`);
  else if(r<p.nguong+0.03) add(15,`LN thuần ${pct(r)} chỉ vượt ngưỡng ${pct(r-p.nguong)}`);
  else f.push({pt:0,t:`LN thuần ${pct(r)} giá vốn, vượt ngưỡng ${pct(p.nguong)}`,lv:'ok'});
  const cn=dealCongNo(d); if(cn>60) add(15,`Công nợ dài ${cn} ngày`); else if(cn>45) add(10,`Công nợ ${cn} ngày`); else if(cn>30) add(5,`Công nợ ${cn} ngày`);
  const prev=DEALS.some(x=>x!==d&&((d.maKH&&x.maKH===d.maKH)||x.cus===d.cus)&&(pDate(x.date)||0)<(pDate(d.date)||0)&&wf(x).stage>=FLOW.length);
  if((d.donHangMoi||'Có')==='Có'&&!prev) add(10,'Khách hàng mới, chưa có lịch sử thanh toán');
  if(hangKey(d)==='Phổ thông') add(5,'Hạng khách hàng Phổ thông');
  if(hasGoods(d)){ const idx=d.lines.filter(l=>isDevLic(l.type)), tot=idx.reduce((s,l)=>s+lineBuy(l),0), mh=idx.reduce((s,l)=>s+lineBuyMH(l),0);
    if(tot>0&&mh>tot*1.03) add(15,`Giá mua Mua hàng đề xuất cao hơn Sale ${pct(mh/tot-1)} (${fmtB(mh-tot)})`);
    else if(tot>0&&mh<tot*0.97) f.push({pt:0,t:`Mua hàng tìm được giá tốt hơn Sale ${pct(1-mh/tot)} (${fmtB(tot-mh)})`,lv:'ok'}); }
  if(p.doanhthu>1e9) add(10,`Giá trị lớn ${fmtB(p.doanhthu)}`); else if(p.doanhthu>BIG) add(5,`Giá trị ${fmtB(p.doanhthu)} (trên 300 tr)`);
  const jr=p.giavon?p.cpbanhang/p.giavon:0; if(jr>0.2) add(10,`CPBH cao: ${pct(jr)} giá vốn`);
  const ret=wf(d).log.filter(x=>x.action==='return').length; if(ret) add(5*ret,`Đã bị trả lại ${ret} lần`);
  const loss=d.lines.filter(l=>lineBuy(l)>0&&lineSell(l)<lineBuy(l)).length; if(loss) add(10,`${loss} dòng bán dưới giá vốn`);
  const score=Math.min(100,f.reduce((s,x)=>s+x.pt,0)), lv=score>=50?'Cao':score>=25?'Trung bình':'Thấp';
  // đơn tương tự
  const ct=dealCt(d), sim=DEALS.filter(x=>x!==d&&!wf(x).lost&&wf(x).stage>=3&&dealCt(x)===ct).map(x=>{ const q=computePL(x); return q.giavon?q.laigop_cuoi/q.giavon:0; });
  const avg=sim.length?sim.reduce((a,b)=>a+b,0)/sim.length:null, rank=sim.length?sim.filter(v=>v<r).length/sim.length:null;
  const okP=r>=p.nguong;
  const rec=!okP||score>=50?{k:'bad',t:'Trả lại AM',why:!okP?'P&L chưa đạt ngưỡng LN':'Rủi ro tổng hợp cao'}:score>=25?{k:'warn',t:'Duyệt có điều kiện',why:'Theo dõi các điểm rủi ro bên dưới'}:{k:'good',t:'Duyệt',why:'Rủi ro thấp, P&L đạt ngưỡng'};
  const conds=[]; if(okP&&score>=25){ f.filter(x=>x.lv!=='ok'&&x.pt>0).slice(0,3).forEach(x=>{
    if(/Công nợ/.test(x.t)) conds.push('Yêu cầu tạm ứng tối thiểu 30% hoặc bảo lãnh thanh toán');
    else if(/Mua hàng/.test(x.t)) conds.push('Chốt giá mua với NCC trước khi ký HĐ khách hàng');
    else if(/mới/.test(x.t)) conds.push('Kiểm tra pháp lý / năng lực tài chính khách hàng mới');
    else if(/CPBH/.test(x.t)) conds.push('Giải trình CPBH bằng văn bản');
    else if(/ngưỡng/.test(x.t)) conds.push('Không cho phép giảm giá thêm khi đàm phán HĐ'); }); }
  return {p,r,score,lv,f,ct,sim:sim.length,avg,rank,rec,conds:[...new Set(conds)]};
}
function riskSummaryText(d,k){
  const types={}; d.lines.forEach(l=>{ const g=groupOfType(l.type).n; types[g]=(types[g]||0)+lineSell(l); });
  const mix=Object.entries(types).sort((a,b)=>b[1]-a[1]).slice(0,3).map(([n,v])=>`${n} ${Math.round(v/k.p.doanhthu*100)}%`).join(', ');
  return `${d.id} · ${d.cus} (${hangKey(d)}, ${(d.donHangMoi||'Có')==='Có'?'đơn mới':'tái ký'}) — doanh thu ${fmtB(k.p.doanhthu)}, giá vốn ${fmtB(k.p.giavon)}, LN thuần ${fmtB(k.p.laigop_cuoi)} (${pct(k.r)} giá vốn; ngưỡng ${pct(k.p.nguong)}). Cơ cấu: ${mix}. Công nợ ${dealCongNo(d)} ngày, AM ${d.am}.`;
}

function normPhoneDigits(v){ let t=String(v||'').replace(/[^\d+]/g,''); if(t.startsWith('+84')) t='0'+t.slice(3); else if(t.startsWith('84')&&t.length===11) t='0'+t.slice(2); return t.replace(/\D/g,''); }
function normDate(v){ const t=String(v||'').trim(); let m;
  if((m=t.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{4})$/))) return `${m[1].padStart(2,'0')}/${m[2].padStart(2,'0')}/${m[3]}`;
  if((m=t.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/))) return `${m[3].padStart(2,'0')}/${m[2].padStart(2,'0')}/${m[1]}`;
  if((m=t.match(/^(\d{2})(\d{2})(\d{4})$/))) return `${m[1]}/${m[2]}/${m[3]}`;
  return t; }
function fkRule(key){ if(/^t\d\d$/.test(key)) return 'days'; return FKEY[key]||null; }
// chuẩn hóa khi nhập: SĐT có khoảng trắng, ngày dd/mm/yyyy, mã in hoa, email chữ thường…
function normInput(key,v){
  const r=fkRule(key); if(v==null||typeof v!=='string') return v; let t=v.replace(/\s+/g,' ').trim(); if(!t) return t;
  if(r==='phone'){ const d=normPhoneDigits(t); if(/^0[35789]\d{8}$/.test(d)) return d.replace(/^(\d{4})(\d{3})(\d{3})$/,'$1 $2 $3'); if(/^02\d{9}$/.test(d)) return d.replace(/^(\d{3})(\d{4})(\d{4})$/,'$1 $2 $3'); return t; }
  if(r==='date') return normDate(t);
  if(r==='mst') return t.replace(/\s/g,'');
  if(r==='bank') return t.replace(/[\s.\-]/g,'');
  if(r==='email') return t.toLowerCase();
  if(r==='code') return t.toUpperCase().replace(/\s/g,'');
  if(r==='congno'&&/^\d{1,3}$/.test(t)) return t+' ngày';
  return t;
}
function fmtErr(key,val){ const r=fkRule(key); if(!r||val==null||String(val).trim()===''||String(val).trim()==='—') return ''; return FR[r].ok(String(val))?'':FR[r].msg; }

  return out;
}

function fmtPass(){
  document.querySelectorAll('#app input[type=text],#app input:not([type]),#app textarea').forEach(el=>{
    let key=el.dataset.f||el.dataset.sf||el.dataset.tf||null;
    if(!key&&el.dataset.path){ try{ const p=JSON.parse(el.dataset.path); key=p[p.length-1]; }catch(e){} }
    let msg='', r=key?fkRule(key):null;
    if(!r&&el.dataset.kind==='pct') r='pct100'; else if(!r&&el.dataset.kind==='num') r='money';
    if(r){ const v=el.value; msg=(v&&v.trim())?(FR[r].ok(v)?'':FR[r].msg):''; if(!el.placeholder&&FR[r].ph) el.placeholder=FR[r].ph; }
    const nx=el.nextElementSibling; if(nx&&nx.classList.contains('ferr')) nx.remove();
    el.classList.toggle('fmt-bad',!!msg);
    if(msg){ el.title=msg; const e=document.createElement('div'); e.className='ferr'; e.textContent=msg; el.insertAdjacentElement('afterend',e); }
  });
}

  else if(role==='procure'||role==='tech') view=renderMH(d,role);
  else if(S.tab==='mh'&&(role==='director'||role==='acc')) view=renderMHProcure(d);
  else if(S.tab==='banmua') view=renderBanMua(d,ed);
  else if(S.tab==='suppliers') view=renderSuppliers(role==='sale'||role==='sadmin');
  else if(S.tab==='form') view=renderForm(d,ed);
  else if(S.tab==='pl') view=renderPLview(d,role);
  const f=d.form||{};
  const tags=[
    d.maKH?`<span class="tag">${d.maKH}</span>`:'',
    f.am?`<span class="tag">AM · ${f.am}</span>`:'',
    f.is?`<span class="tag">IS · ${f.is}</span>`:'',
    d.date?`<span class="tag">${d.date}</span>`:'',
  ].filter(Boolean).join('');
  const cusField=ed
    ? `<input type="text" class="cus-in" value="${d.cus||''}" placeholder="Nhập tên khách hàng…" aria-label="Tên khách hàng" onchange="setCus(this)">`
    : `<h2>${d.cus||'(chưa có tên khách hàng)'}</h2>`;
  const lock=((role==='sale'||role==='sadmin')&&!ed&&!wfClosed(d))?`<span class="tag warn">🔒 Đã gửi duyệt — tạm khóa chỉnh sửa</span>`:'';
  const head=`<section class="panel"><div class="panel-h">${cusField}<span class="spacer"></span>${lock}
      <button class="btn sm" onclick="toggleInfo()">${S.infoOpen?'▾ Ẩn thông tin KH &amp; giao nhận':'▸ Thông tin KH &amp; giao nhận'}</button></div>
      <div class="panel-b deal-sub row">${tags}${d.duAn?`<span>${d.duAn}</span>`:''}</div></section>`;
  const infoBlock=S.infoOpen?(renderInfo(d,ed)+(role==='tech'?'':renderDelivery(d,ed))):'';
  const aiNote=d.aiNote?`<div class="ai-card"><span class="ai-mark">✦ AI</span> Đơn tạo từ file <b>${escH(d.aiNote.src)}</b>.${d.aiNote.thieu.length?` Còn thiếu: <b>${d.aiNote.thieu.map(escH).join(', ')}</b>.`:''} ${escH(d.aiNote.ghiChu)} Kiểm tra lại Phiếu khảo sát &amp; Danh mục trước khi gửi duyệt.</div>`:'';
  PAGE={title:`${d.id} · ${TABLABEL[S.tab]}`,back:goList,actions:''};
  return `${head}${aiNote}${renderWorkflow(d)}${ctSummary(d)}${infoBlock}${view}${renderCtDraft()}`;
}
const TABICON={info:'doc',banmua:'box',suppliers:'truck',form:'doc',pl:'chart',mh:'cart',flow:'flow',config:'cog'};
const ICONS={
  list:'<path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/>',
  inbox:'<path d="M22 12h-6l-2 3h-4l-2-3H2"/><path d="M5.45 5.11 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"/>',
  doc:'<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6M8 13h8M8 17h5"/>',
  box:'<path d="M21 8 12 3 3 8v8l9 5 9-5z"/><path d="M3 8l9 5 9-5M12 13v8"/>',
  truck:'<path d="M1 3h15v13H1zM16 8h4l3 3v5h-7z"/><circle cx="5.5" cy="18.5" r="2.5"/><circle cx="18.5" cy="18.5" r="2.5"/>',
  chart:'<path d="M3 3v18h18"/><path d="M7 15l4-4 3 3 5-6"/>',
  cart:'<circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.7 13.4a2 2 0 0 0 2 1.6h9.7a2 2 0 0 0 2-1.6L23 6H6"/>',
  flow:'<rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/><path d="M10 6.5h4a2 2 0 0 1 2 2V14"/>',
  cog:'<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1 7 17M17 7l2.1-2.1"/>'
};
const ico=k=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICONS[k]}</svg>`;
function renderChrome(){
  const role=S.role, VD=visibleDeals(), mine=VD.filter(d=>wfNeedsMe(d,role));
  const P=PAGE||{title:''};
  document.getElementById('topTitle').textContent=P.title;
  const back=document.getElementById('topBack'); back.hidden=!P.back; back.onclick=P.back||null;
  document.getElementById('topActions').innerHTML=P.actions||'';
  document.getElementById('roleMark').textContent=ROLECODE[role]||'TB';
  document.getElementById('roleName').textContent=ROLEMETA[role].n;
  document.getElementById('roleUser').textContent=S.user?('Đăng nhập: '+S.user):'Toàn bộ đơn hàng';
  const onList=S.screen==='list'&&!(role==='admin'&&S.adminConfig);
  let h=`<h6>Đơn hàng</h6><a href="#" class="${onList?'on':''}" onclick="navList('all');return false" title="${mine.length?mine.length+' đơn cần bạn xử lý':VD.length+' đơn'}">${ico('list')}<span class="nav-t">Danh sách đơn</span><span class="cnt">${mine.length||VD.length}</span></a>`
    +(DASH_ROLES.includes(role)?`<a href="#" class="${S.screen==='dash'?'on':''}" onclick="navDash();return false">${ico('chart')}<span class="nav-t">Dashboard kinh doanh</span></a>`:'');
  if(S.screen==='detail'){ const d=activeDeal();
    h+=`<h6>Đơn ${d.id}</h6>`+ROLETABS[role].map(t=>`<a href="#" class="${S.tab===t?'on':''}" onclick="setTab('${t}');return false">${ico(TABICON[t])}<span class="nav-t" title="${TABLABEL[t]}">${TABLABEL[t]}</span>${t==='flow'&&wfNeedsMe(d,role)?'<span class="cnt">!</span>':''}</a>`).join('');
  }
  if(role==='admin') h+=`<h6>Hệ thống</h6><a href="#" class="${S.adminConfig&&S.screen==='list'?'on':''}" onclick="showConfig();return false">${ico('cog')}<span class="nav-t">Cấu hình hệ thống</span></a>`;
  document.getElementById('nav').innerHTML=h;
  document.getElementById('sideFoot').innerHTML=`<div>${ROLEMETA[role].d}</div><div class="mt-sm">🔐 ${scopeText(role)}</div>`;
}
function closeSide(){ document.getElementById('side').classList.remove('open'); document.getElementById('ov').classList.remove('open'); }
window.navList=function(f){ S.retDash=false; DRILL.open=false; S.screen='list'; S.dealId=null; S.adminConfig=false; S.listFilter=f; draw(); };
window.setTab=function(t){ S.tab=t; draw(); document.querySelector('.content').scrollTop=0; };
// Thanh cuộn ngang đặt phía trên bảng (dính đầu vùng xem khi cuộn dọc) — không phải kéo xuống cuối bảng mới cuộn ngang được
function topScrollPass(){
  document.querySelectorAll('#app .tbl-wrap, #app .board').forEach(w=>{
    const prev=w.previousElementSibling; if(prev&&prev.classList.contains('xscroll')) prev.remove();
    w.classList.remove('has-xtop');
    if(w.scrollWidth<=w.clientWidth+2) return;
    const bar=document.createElement('div'); bar.className='xscroll'; bar.title='Kéo để cuộn ngang';
    const inner=document.createElement('div'); inner.style.width=w.scrollWidth+'px'; bar.appendChild(inner);
    w.parentNode.insertBefore(bar,w); w.classList.add('has-xtop');
    bar.addEventListener('scroll',()=>{ if(w.scrollLeft!==bar.scrollLeft) w.scrollLeft=bar.scrollLeft; });
    w.addEventListener('scroll',()=>{ if(bar.scrollLeft!==w.scrollLeft) bar.scrollLeft=w.scrollLeft; });
    bar.scrollLeft=w.scrollLeft;
  });
}
let _xsT; window.addEventListener('resize',()=>{ clearTimeout(_xsT); _xsT=setTimeout(()=>{ try{ topScrollPass(); }catch(e){} },150); });
function draw(){
  if(S.screen==='dash'&&!DASH_ROLES.includes(S.role)) S.screen='list';
  const html=S.screen==='list'?renderList():S.screen==='dash'?renderDash():renderDetail();
  document.getElementById('app').innerHTML=html+renderPlImport();
  try{ fmtPass(); }catch(e){}
  try{ topScrollPass(); }catch(e){}
  renderChrome();
  closeSide();
}
document.getElementById('role').addEventListener('change',e=>{
  S.role=e.target.value; S.wfNote=''; S.wfErr=''; S.listFilter='all'; S.screen='list'; S.dealId=null; draw();});
document.getElementById('user').addEventListener('change',e=>{
  S.user=e.target.value; S.listFilter='all'; S.screen='list'; S.dealId=null; draw();});
(function(){ const m={'TM-1036':'ThuDTH','DV-0207':'ThuDTH','DV-0210':'ThuDTH','TM-1041':'NguyenNTT','TM-1050':'NguyenNTT'};
  DEALS.forEach(d=>{ if(m[d.id]&&!d.sa) d.sa=m[d.id]; }); })();
draw();
</script>
