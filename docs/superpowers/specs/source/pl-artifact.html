<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TeraBox · Hiệu quả đơn hàng (P&amp;L) (Copy)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400..700&display=swap" rel="stylesheet">
<style>
/* ==========================================================
   TERABOX SUPER APP — DESIGN TOKENS (v1)
   Tông: TeraBox Sky · Font: Geist · Bo góc vừa · Mật độ nhỏ gọn
   Dùng cho: CSS thuần, Tailwind v4 (@theme), shadcn/ui
   Quy tắc: UI chỉ dùng SEMANTIC token (mục 2), không dùng primitive hay hex trực tiếp.
   ========================================================== */



/* ---------- 1. PRIMITIVE ---------- */
:root {
  /* Sky — màu thương hiệu TeraBox */
  --sky-50:#EEF8FE; --sky-100:#D8EFFC; --sky-200:#B3E0FA; --sky-300:#7CCBF6;
  --sky-400:#3FB0EE; --sky-500:#1797DE; --sky-600:#0B7BC0; --sky-700:#0C6399;
  --sky-800:#10527D; --sky-900:#134568; --sky-950:#0D2C44;

  /* Slate — xám lạnh */
  --slate-0:#FFFFFF; --slate-50:#F7F8FA; --slate-100:#EFF1F5; --slate-200:#E2E5EC;
  --slate-300:#CBD0DA; --slate-400:#9AA1B1; --slate-500:#6B7385; --slate-600:#4E5566;
  --slate-700:#3A404E; --slate-800:#252A35; --slate-900:#171A22; --slate-950:#0E1016;
}

/* ---------- 2. SEMANTIC — LIGHT ---------- */
:root {
  --background:#CDE7F8;              /* nền trang xanh nhạt */
  --foreground:var(--slate-900);
  --surface:var(--slate-0);          /* card, sidebar, header, modal */
  --surface-2:#F1F7FC;               /* header bảng, ô bị khóa, nền phụ trong card */
  --muted-foreground:#566174;        /* chữ phụ — đạt AA trên cả nền xanh */
  --subtle-foreground:var(--slate-600);
  --border:#D3E2EE;
  --input:#BFD3E3;
  --ring:var(--sky-500);

  --primary:var(--sky-600);          /* nút chính — 4.56:1 với chữ trắng */
  --primary-hover:var(--sky-700);
  --primary-foreground:#FFFFFF;
  --primary-subtle:var(--sky-50);    /* menu active, badge, card AI */
  --primary-subtle-fg:var(--sky-700);

  --success:#1F9D55; --success-subtle:#EAF7EF;
  --warning:#B26D09; --warning-subtle:#FDF4E6;
  --danger:#D93A3A;  --danger-subtle:#FCEDED;
  --info:#6E56CF;    --info-subtle:#F1EEFC;   /* tím để không lẫn với primary */
  --scrim:rgba(14,16,22,.45);

  /* Typography — thang nhỏ gọn */
  --font-sans:Geist,"Geist Fallback",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --font-mono:ui-monospace,"SF Mono",Consolas,monospace;
  --text-xs:.75rem;     /* 12 — nhãn, tag, chữ phụ (nhỏ nhất) */
  --text-sm:.8125rem;   /* 13 — nội dung, bảng, menu (mặc định body) */
  --text-base:.875rem;  /* 14 — tiêu đề panel */
  --text-lg:1rem;       /* 16 — tiêu đề modal */
  --text-xl:1.125rem;   /* 18 — tiêu đề trang, số liệu thống kê */
  --text-2xl:1.25rem;   /* 20 */
  --text-3xl:1.5rem;    /* 24 */
  --text-4xl:1.875rem;  /* 30 — đồng hồ, hero */
  --leading:1.45;

  /* Bo góc */
  --radius-sm:6px;      /* tag nhỏ, checkbox, ô lịch */
  --radius-md:8px;      /* nút, ô nhập, menu item */
  --radius-lg:14px;     /* card, panel, dropdown */
  --radius-xl:18px;     /* modal */
  --radius-full:9999px; /* tag trạng thái, chip, nút lọc */
  --radius:var(--radius-md);

  /* Đổ bóng */
  --shadow-sm:0 1px 2px rgba(23,26,34,.06);
  --shadow-md:0 2px 8px rgba(12,40,68,.08),0 1px 2px rgba(23,26,34,.04);
  --shadow-lg:0 12px 32px rgba(12,40,68,.12),0 2px 6px rgba(23,26,34,.05);

  /* Chuyển động */
  --duration-fast:120ms; --duration-base:200ms; --ease-standard:cubic-bezier(.2,0,0,1);

  /* Kích thước — mật độ nhỏ gọn */
  --control-h:32px;     /* nút lớn, big input */
  --control-h-sm:28px;  /* nút, ô nhập mặc định */
  --control-h-xs:24px;  /* nút nhỏ trong bảng */
  --header-h:48px;
  --sidebar-w:220px;
  --nav-item-h:30px;
  --table-cell-py:6px; --table-cell-px:10px;  /* hàng bảng ~30px */

  /* Spacing (lưới 2/4px) */
  --space-1:4px; --space-2:8px; --space-3:12px; --space-4:16px;
  --space-5:20px; --space-6:24px; --space-8:32px;
  --gap-panel:12px;     /* khoảng cách giữa các panel/card */
  --pad-panel:12px 14px;
  --pad-page:14px 16px;

  color-scheme:light;
}

/* ---------- 3. SEMANTIC — DARK ---------- */
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --background:var(--slate-950); --foreground:var(--slate-100);
    --surface:var(--slate-900); --surface-2:var(--slate-800);
    --muted-foreground:var(--slate-400); --subtle-foreground:var(--slate-300);
    --border:#2A2F3B; --input:var(--slate-700); --ring:var(--sky-400);
    --primary:var(--sky-400); --primary-hover:var(--sky-300); --primary-foreground:var(--sky-950);
    --primary-subtle:rgba(63,176,238,.14); --primary-subtle-fg:var(--sky-200);
    --success:#5FC88A; --success-subtle:rgba(31,157,85,.16);
    --warning:#E9A84A; --warning-subtle:rgba(199,122,10,.16);
    --danger:#F08080;  --danger-subtle:rgba(217,58,58,.16);
    --info:#B4A5F5;    --info-subtle:rgba(110,86,207,.18);
    --scrim:rgba(0,0,0,.6);
    --shadow-sm:0 1px 2px rgba(0,0,0,.4); --shadow-md:0 2px 8px rgba(0,0,0,.45); --shadow-lg:0 12px 32px rgba(0,0,0,.55);
    color-scheme:dark;
  }
}
:root[data-theme="dark"] {
  --background:var(--slate-950); --foreground:var(--slate-100);
  --surface:var(--slate-900); --surface-2:var(--slate-800);
  --muted-foreground:var(--slate-400); --subtle-foreground:var(--slate-300);
  --border:#2A2F3B; --input:var(--slate-700); --ring:var(--sky-400);
  --primary:var(--sky-400); --primary-hover:var(--sky-300); --primary-foreground:var(--sky-950);
  --primary-subtle:rgba(63,176,238,.14); --primary-subtle-fg:var(--sky-200);
  --success:#5FC88A; --success-subtle:rgba(31,157,85,.16);
  --warning:#E9A84A; --warning-subtle:rgba(199,122,10,.16);
  --danger:#F08080;  --danger-subtle:rgba(217,58,58,.16);
  --info:#B4A5F5;    --info-subtle:rgba(110,86,207,.18);
  --scrim:rgba(0,0,0,.6);
  --shadow-sm:0 1px 2px rgba(0,0,0,.4); --shadow-md:0 2px 8px rgba(0,0,0,.45); --shadow-lg:0 12px 32px rgba(0,0,0,.55);
  color-scheme:dark;
}


/* ---------- 5. BASE ---------- */
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0}
body{
  background:var(--background); color:var(--foreground);
  font-family:var(--font-sans); font-size:var(--text-sm); line-height:var(--leading);
  -webkit-font-smoothing:antialiased;
}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--ring);outline-offset:2px}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}

/* ==========================================================
   TERABOX SUPER APP — COMPONENTS (v1)
   CSS component thuần, dùng kèm tokens.css. Trích từ bản HRM TeraBox đã duyệt.
   Dùng cho app không dùng React/shadcn: import tokens.css trước, rồi file này.
   Class chính: .app .side .nav .top .content .btn(.pri .ghost .danger .sm .ai)
   .icon-btn .panel(.panel-h .panel-b) .stats .stat table .tag(.good .warn .bad .info .acc)
   .alert .tabs .seg .list .kv .cal .modal .toast .drop .ai-card
   ========================================================== */


/* ============ BASE ============ */
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:var(--background);color:var(--foreground);font-family:var(--font-sans);font-size:var(--text-sm);line-height:1.45;-webkit-font-smoothing:antialiased;font-optical-sizing:auto}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:50;background:var(--surface)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--ring);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.app{display:grid;grid-template-columns:var(--sidebar-w) 1fr;height:100%}

/* ============ SIDEBAR ============ */
.side{background:var(--surface);color:var(--foreground);border-right:1px solid var(--border);display:flex;flex-direction:column;overflow-y:auto}
.brand{height:var(--header-h);padding:0 16px;display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--border)}
.brand-mark{width:28px;height:28px;border-radius:var(--radius-md);background:var(--primary);display:grid;place-items:center;color:var(--primary-foreground);font-weight:700;font-size:var(--text-sm)}
.brand b{display:block;font-size:var(--text-base);font-weight:600;letter-spacing:-.01em;color:var(--foreground);line-height:1.3}
.brand small{color:var(--muted-foreground);font-size:var(--text-xs)}
.nav{padding:6px 8px 12px;flex:1}
.nav h6{margin:12px 8px 2px;font-size:var(--text-xs);font-weight:600;color:var(--muted-foreground)}
.nav a{display:flex;align-items:center;gap:10px;height:30px;padding:0 8px;border-radius:var(--radius-md);color:var(--foreground);text-decoration:none;cursor:pointer;font-size:var(--text-sm);font-weight:400;transition:background var(--duration-fast) var(--ease-standard)}
.nav a:hover{background:var(--surface-2);color:var(--foreground)}
.nav a.on{background:var(--primary-subtle);color:var(--primary-subtle-fg);font-weight:500}
.nav a.on svg{opacity:1}
.nav a .cnt{margin-left:auto;background:var(--primary);color:var(--primary-foreground);border-radius:var(--radius-full);font-size:var(--text-xs);line-height:20px;min-width:20px;text-align:center;padding:0 6px;font-weight:600}
.nav svg{width:16px;height:16px;flex:none;opacity:.75}
.side-foot{padding:10px 12px;font-size:var(--text-xs);color:var(--muted-foreground);border-top:1px solid var(--border)}

/* ============ MAIN ============ */
.main{display:flex;flex-direction:column;min-width:0;height:100%;overflow:hidden}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;align-items:center;gap:12px;height:var(--header-h);padding:0 16px;background:var(--surface);border-bottom:1px solid var(--border)}
.top h1{font-size:var(--text-xl);margin:0;font-weight:600;letter-spacing:-.015em;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.icon-btn.menu-btn{display:none}
.who{display:flex;align-items:center;gap:8px}
.who select{max-width:260px}
.content{flex:1;overflow:auto;padding:14px 16px 40px}
.wrap{max-width:1280px;margin:0 auto}
.avatar{width:26px;height:26px;border-radius:var(--radius-full);background:var(--primary-subtle);color:var(--primary-subtle-fg);display:grid;place-items:center;font-weight:600;font-size:var(--text-xs);flex:none}

/* ============ CONTROLS ============ */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:var(--control-h-sm);border:1px solid var(--border);background:var(--surface);padding:0 10px;border-radius:var(--radius-md);cursor:pointer;font-weight:500;font-size:var(--text-sm);white-space:nowrap;box-shadow:var(--shadow-sm);transition:background var(--duration-fast) var(--ease-standard),border-color var(--duration-fast) var(--ease-standard)}
.btn:hover{background:var(--surface-2)}
.btn.pri{background:var(--primary);border-color:var(--primary);color:var(--primary-foreground);font-weight:600}
.btn.pri:hover{background:var(--primary-hover);border-color:var(--primary-hover)}
.btn.danger{color:var(--danger);border-color:color-mix(in srgb,var(--danger) 35%,var(--border))}
.btn.danger:hover{background:var(--danger-subtle)}
.btn.ghost{border-color:transparent;background:transparent;box-shadow:none}
.btn.ghost:hover{background:var(--surface-2)}
.btn.sm{height:24px;padding:0 8px;font-size:var(--text-xs);gap:4px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.icon-btn{border:1px solid var(--border);background:var(--surface);width:var(--control-h-sm);height:var(--control-h-sm);border-radius:var(--radius-md);display:grid;place-items:center;cursor:pointer;position:relative;color:var(--subtle-foreground)}
.icon-btn:hover{background:var(--surface-2);color:var(--foreground)}
.icon-btn .dot{position:absolute;top:4px;right:4px;width:8px;height:8px;border-radius:50%;background:var(--danger);box-shadow:0 0 0 2px var(--surface)}
input[type=text],input[type=number],input[type=date],input[type=time],input[type=email],input[type=password],select,textarea{border:1px solid var(--input);background:var(--surface);border-radius:var(--radius-md);height:var(--control-h-sm);padding:0 10px;font-size:var(--text-sm);width:100%;min-width:0;box-shadow:var(--shadow-sm);transition:border-color var(--duration-fast),box-shadow var(--duration-fast)}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--ring);box-shadow:0 0 0 3px var(--primary-subtle)}
textarea{height:auto;min-height:56px;padding:6px 10px;resize:vertical}
input:disabled,select:disabled,textarea:disabled{background:var(--surface-2);color:var(--muted-foreground)}
label.f{display:flex;flex-direction:column;gap:2px;font-size:var(--text-sm);color:var(--subtle-foreground);font-weight:500}
label.f .hint{font-weight:400;color:var(--muted-foreground);font-size:var(--text-xs)}
label.ck{display:flex;gap:8px;align-items:center;font-size:var(--text-sm);cursor:pointer}
input[type=checkbox],input[type=radio]{accent-color:var(--primary);width:16px;height:16px}
.grid{display:grid;gap:10px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.span2{grid-column:span 2}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row.end{justify-content:flex-end}
.spacer{flex:1}
.muted{color:var(--subtle-foreground)}
.faint{color:var(--muted-foreground);font-size:var(--text-xs)}

/* ============ PANELS ============ */
.panel{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);margin-bottom:12px;box-shadow:var(--shadow-sm);overflow:clip}
.panel-h{display:flex;align-items:center;gap:8px;padding:8px 14px;border-bottom:1px solid var(--border);flex-wrap:wrap}
.panel-h h2{font-size:var(--text-base);margin:0;font-weight:600;letter-spacing:-.01em}
.panel-h .sub{color:var(--muted-foreground);font-size:var(--text-xs)}
.panel-b{padding:12px 14px}
.panel-b.flush{padding:0}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin-bottom:12px}
.stat{padding:8px 10px;text-align:center;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);box-shadow:var(--shadow-sm)}
.stat .k{font-size:var(--text-xs);line-height:1.4;color:var(--muted-foreground);font-weight:500}
.stat .v{font-size:var(--text-xl);font-weight:600;margin-top:2px;line-height:1.2;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.stat .v small{font-size:var(--text-xs);color:var(--muted-foreground);font-weight:500;margin-left:3px;letter-spacing:0}

/* ============ TABLE ============ */
.tbl-wrap{overflow-x:auto}
.xscroll{overflow-x:auto;overflow-y:hidden;position:sticky;top:0;z-index:6;height:12px;background:var(--surface);border-radius:6px;margin:0 0 2px;scrollbar-width:auto}
.xscroll>div{height:1px}
.xscroll::-webkit-scrollbar{height:12px}.xscroll::-webkit-scrollbar-thumb{background:color-mix(in srgb,var(--muted-foreground) 45%,transparent);border-radius:6px}.xscroll::-webkit-scrollbar-track{background:var(--surface-2)}
.has-xtop{scrollbar-width:none}.has-xtop::-webkit-scrollbar{display:none}
table{border-collapse:collapse;width:100%;font-size:var(--text-sm)}
th{text-align:center;font-weight:500;font-size:var(--text-xs);color:var(--muted-foreground);background:var(--surface-2);padding:6px 10px;border-bottom:1px solid var(--border);white-space:nowrap;position:sticky;top:0}
td{padding:6px 10px;border-bottom:1px solid var(--border);vertical-align:middle}
tr:last-child td{border-bottom:0}
td{text-align:center}
td.r,th.r{text-align:center;font-variant-numeric:tabular-nums}
td.c,th.c{text-align:center}
tr.click{cursor:pointer}
tr.click:hover td{background:var(--surface-2)}
tr.var-hi td{background:var(--warning-subtle)}
tr.neg td{background:var(--danger-subtle)}
tfoot td{font-weight:600;background:var(--surface-2)}
table input.cell-in{width:80px;height:24px;box-shadow:none;padding:0 8px;text-align:right;font-size:var(--text-xs)}
td.nm{white-space:nowrap}
.empty{padding:24px 16px;text-align:center;color:var(--muted-foreground)}

/* ============ TAGS & ALERTS ============ */
.tag{display:inline-flex;align-items:center;gap:4px;height:20px;padding:0 8px;border-radius:var(--radius-full);font-size:var(--text-xs);font-weight:500;background:var(--surface-2);color:var(--subtle-foreground);white-space:nowrap}
.tag.good{background:var(--success-subtle);color:var(--success)}
.tag.warn{background:var(--warning-subtle);color:var(--warning)}
.tag.bad{background:var(--danger-subtle);color:var(--danger)}
.tag.info{background:var(--info-subtle);color:var(--info)}
.tag.acc{background:var(--primary-subtle);color:var(--primary-subtle-fg)}
.alert{padding:8px 12px;border-radius:var(--radius-md);font-size:var(--text-sm);margin-bottom:10px;display:flex;gap:8px;align-items:flex-start;border:1px solid transparent}
.alert.warn{background:var(--warning-subtle);color:var(--warning);border-color:color-mix(in srgb,var(--warning) 20%,transparent)}
.alert.bad{background:var(--danger-subtle);color:var(--danger);border-color:color-mix(in srgb,var(--danger) 20%,transparent)}
.alert.info{background:var(--info-subtle);color:var(--info);border-color:color-mix(in srgb,var(--info) 20%,transparent)}
.alert.good{background:var(--success-subtle);color:var(--success);border-color:color-mix(in srgb,var(--success) 20%,transparent)}
.list{list-style:none;margin:0;padding:0}
.list li{padding:8px 14px;border-bottom:1px solid var(--border);display:flex;gap:12px;align-items:center}
.list li:last-child{border-bottom:0}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--border);padding:0 14px;overflow-x:auto}
.tabs button{border:0;background:none;padding:8px 8px;margin-bottom:-1px;cursor:pointer;color:var(--muted-foreground);font-weight:500;font-size:var(--text-sm);border-bottom:2px solid transparent;white-space:nowrap}
.tabs button:hover{color:var(--foreground)}
.tabs button.on{color:var(--primary);border-bottom-color:var(--primary)}
.kv{display:grid;grid-template-columns:150px 1fr;gap:4px 12px;font-size:var(--text-sm)}
.kv dt{color:var(--muted-foreground)}
.kv dd{margin:0}
.masked{letter-spacing:.12em;color:var(--muted-foreground)}

/* ============ TIMELINE ============ */
.tl{list-style:none;margin:0;padding:0 0 0 16px;border-left:2px solid var(--border)}
.tl li{position:relative;padding:0 0 10px 12px;font-size:var(--text-sm)}
.tl li::before{content:"";position:absolute;left:-23px;top:5px;width:12px;height:12px;border-radius:50%;background:var(--surface);border:2px solid var(--primary)}

/* ============ CALENDAR ============ */
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cal .dh{font-size:var(--text-xs);color:var(--muted-foreground);text-align:center;padding-bottom:4px;font-weight:500}
.cal .d{border:1px solid var(--border);border-radius:var(--radius-sm);padding:4px 6px;min-height:58px;background:var(--surface);font-size:var(--text-xs);display:flex;flex-direction:column;align-items:center;text-align:center;gap:4px}
.cal .d .n{font-weight:600;font-size:var(--text-sm)}
.cal .d.we{background:var(--surface-2);border-color:transparent}
.cal .d.out{opacity:.35}
.cal .d.today{border-color:var(--primary);box-shadow:inset 0 0 0 1px var(--primary)}

(function(){
  const KEY='tbx-pl-theme', btn=document.getElementById('themeBtn'), root=document.documentElement;
  const ICON={
    auto:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/></svg>',
    light:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>',
    dark:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>'};
  const LABEL={auto:'theo hệ thống',light:'sáng',dark:'tối'};
  const NEXT={auto:'light',light:'dark',dark:'auto'};
  let mode='auto';
  try{ mode=localStorage.getItem(KEY)||'auto'; }catch(e){}
  if(!ICON[mode]) mode='auto';
  function apply(){
    if(mode==='auto') root.removeAttribute('data-theme'); else root.setAttribute('data-theme',mode);
    btn.innerHTML=ICON[mode];
    btn.title='Giao diện: '+LABEL[mode]+' · bấm để chuyển sang '+LABEL[NEXT[mode]];
  }
  btn.onclick=()=>{ mode=NEXT[mode]; try{ localStorage.setItem(KEY,mode); }catch(e){} apply(); };
  apply();
})();
</script>

function findSupplier(name){ return SUPPLIERS.find(s=>s.ten===(name||'')); }
function getDotTT(sup){ return (sup&&sup.dotTT&&sup.dotTT.length)?sup.dotTT:[{ten:'Tạm ứng',tyLe:0.30,ngay:5}]; }
function ttRemain(sup){ const used=getDotTT(sup).reduce((s,x)=>s+(x.tyLe||0),0); return Math.max(0,1-used); }
function ttSummary(sup){
  if(!sup) return '—';
  const dots=getDotTT(sup);
  const lastIdx=dots.length-1;
  const parts=dots.map((x,di)=>{
    const khi=(di===lastIdx&&di>0&&x.truocNhanHang)?' (trước khi nhận hàng)':'';
    return `${x.ten} ${pct(x.tyLe)}${khi}`;
  });
  parts.push(`Tất toán ${pct(ttRemain(sup))}`);
  return parts.join(' · ')+` · Công nợ ${sup.congNo??30} ngày`;
}

// 6 giai đoạn deal & tỷ lệ mặc định — khớp mục 13-18 của "Phiếu khảo sát" (tổng = 100% lãi gộp cuối)
const STAGE_DEFS=[
  {ten:'13/ Opportunities (Cơ hội)',pct:0.20},
  {ten:'14/ Requirement Clarification (Làm rõ yêu cầu)',pct:0.30},
  {ten:'15/ Quotation (Báo giá)',pct:0.10},
  {ten:'16/ Negotiation (Đàm phán)',pct:0.10},
  {ten:'17/ Close Deal (Chốt deal)',pct:0.20},
  {ten:'18/ Contract / Payment / Support (HĐ · Thanh toán · CSKH)',pct:0.10},
];
function defaultStages(f){
  return STAGE_DEFS.map((s,i)=>({...s, nv:(i===STAGE_DEFS.length-1 && f.is && f.is!=='—') ? f.is : f.am}));
}
function getStages(d){ return (d.form.stages&&d.form.stages.length)?d.form.stages:defaultStages(d.form); }
function allPeople(){
  const out=[];
  Object.keys(CONFIG.nhanSu||{}).forEach(t=>(CONFIG.nhanSu[t]||[]).forEach(p=>{ if(!out.includes(p)) out.push(p); }));
  return out;
}
function salesPeople(){
  const out=[];
  Object.keys(CONFIG.nhanSu||{}).forEach(t=>{
    if(!/sale|inside|\bsa\b/i.test(t)) return;
    (CONFIG.nhanSu[t]||[]).forEach(p=>{ if(!out.includes(p)) out.push(p); });
  });
  return out.length?out:allPeople();
}
function insidePeople(){
  const out=[];
  Object.keys(CONFIG.nhanSu||{}).forEach(t=>{
    if(!/inside|\bsa\b|sales admin/i.test(t)) return;
    (CONFIG.nhanSu[t]||[]).forEach(p=>{ if(!out.includes(p)) out.push(p); });
  });
  return out.length?out:salesPeople();
}
function techPeople(){
  const out=[];
  Object.keys(CONFIG.nhanSu||{}).forEach(t=>{
    if(!/technical|ky thuat|kỹ thuật/i.test(t)) return;
    (CONFIG.nhanSu[t]||[]).forEach(p=>{ if(!out.includes(p)) out.push(p); });
  });
  return out.length?out:allPeople();
}
function computeChia(d,laigop_cuoi){
  const f=d.form, stages=getStages(d), map={};
  stages.forEach(s=>{ if(!s.nv) return;
    if(!map[s.nv]) map[s.nv]={ai:s.nv,parts:[],coef:0};
    map[s.nv].parts.push(s.ten.replace(/^\d+\/\s*/,'')+' '+pct(s.pct)); map[s.nv].coef+=s.pct; });
  const nguon=f.nguon_kh;
  if(nguon&&nguon!=='Không'&&map[nguon]){ map[nguon].coef+=0.2; map[nguon].parts.push('+ nguồn khách hàng (+20%)'); }
  return Object.values(map).map(m=>({ai:m.ai,role:m.parts.join(' · '),tien:Math.round(laigop_cuoi*m.coef)}));
}

// Tự nhận diện loại hợp đồng từ danh mục hàng hóa/dịch vụ (cho phép nhiều giá trị)
const CONTRACT_KINDS=[
  {ten:'Thương mại 1 lần',  cfgKey:'Thương Mại',      match:l=>ctKeyOfType(l.type)==='Thương Mại'},
  {ten:'Thương mại định kỳ',cfgKey:'License/Runrate', match:l=>ctKeyOfType(l.type)==='License/Runrate'},
  {ten:'Dịch vụ 1 lần',     cfgKey:'Dịch vụ Loại I',  match:l=>ctKeyOfType(l.type)==='Dịch vụ Loại I'},
  {ten:'Dịch vụ định kỳ',   cfgKey:'Dịch vụ Loại II', match:l=>ctKeyOfType(l.type)==='Dịch vụ Loại II'},
];
// Quy tắc: DV tính theo tháng → DV định kỳ · license có kỳ hạn (LIC-DK, LIC-NTNN) → TM định kỳ · DV còn lại → DV 1 lần · TB + LIC vĩnh viễn → TM 1 lần
function ctKeyOfType(t){
  if(mulMonths(t)) return 'Dịch vụ Loại II';
  if(isTMDK(t)) return 'License/Runrate';
  if(isSvc(t)) return 'Dịch vụ Loại I';
  return 'Thương Mại';
}
const CT_NAME={'Thương Mại':'Thương mại 1 lần','License/Runrate':'Thương mại định kỳ (TMDK)','Dịch vụ Loại I':'Dịch vụ 1 lần','Dịch vụ Loại II':'Dịch vụ định kỳ'};
function detectContracts(d){
  return CONTRACT_KINDS.map(k=>{
    const lines=(d.lines||[]).filter(k.match);
    return lines.length?{...k,sl:lines.length,doanhthu:lines.reduce((s,l)=>s+lineSell(l),0)}:null;
  }).filter(Boolean);
}
function dealCt(d){
  const det=detectContracts(d);
  const keys=det.map(x=>x.cfgKey);
  if(d.form&&d.form.ct&&(keys.includes(d.form.ct)||!det.length)) return d.form.ct;
  if(det.length){
    const top=det.slice().sort((a,b)=>b.doanhthu-a.doanhthu)[0];
    return top.cfgKey;
  }
  return (d.form&&d.form.ct)||d.ct;
}
function dealCongNo(d){
  const raw=(d.form&&d.form.congno!==undefined&&d.form.congno!=='')?d.form.congno:d.congno;
  const n=parseNum(raw);
  return isNaN(n)?(d.congno||30):n;
}
const HANG_KEYS=['VIP','Tiềm năng','Phổ thông'];
function hangKey(d){
  const h=(d.form&&d.form.hang)||'';
  if(/VIP/i.test(h)) return 'VIP';
  if(/tiềm năng/i.test(h)) return 'Tiềm năng';
  return 'Phổ thông';
}
function rateCPTC(jr,hang){
  const c=(CONFIG.cpTaiChinh||{})[hang]||{};
  const bac=(c.bac||[]).slice().sort((a,b)=>a.tu-b.tu);
  let r=(c.duoiNguong!==undefined?c.duoiNguong:0.20);
  bac.forEach(b=>{ if(jr>=b.tu) r=b.r; });
  return r;
}
function computePL(d){
  const cfg=CONFIG.loaiHopDong[dealCt(d)]||{};
  const doanhthu=sumSell(d), giavon=sumBuy(d);
  const laigop_chung=doanhthu-giavon;
  const cpbanhang=parseNum(d.form.cpbh)||0;
  const hang=hangKey(d);
  const jr=giavon?cpbanhang/giavon:0;
  const rate=cpbanhang<=0?0:rateCPTC(jr,hang);
  const cptaichinh=cpbanhang>0?Math.round(cpbanhang*rate/(1-rate)):0;
  const laigop_saugg=laigop_chung-cpbanhang-cptaichinh;

  const tbBuy=d.lines.filter(l=>l.type==='TB'&&parseNum(l.m)>0).reduce((s,l)=>s+lineBuy(l)*Math.ceil(parseNum(l.m)/12),0);
  const baohanh=Math.round(tbBuy*CONFIG.baohanhTB);
  const licBuy=d.lines.filter(l=>isLicLike(l.type)).reduce((s,l)=>s+lineBuy(l),0);
  const hotro_license=Math.round(licBuy*CONFIG.hotroLicense);
  const dvdkIBuy=d.lines.filter(l=>l.type==='DVDK-I').reduce((s,l)=>s+lineBuy(l),0);
  const dvtkOBuy=d.lines.filter(l=>l.type==='DVTK-O').reduce((s,l)=>s+lineBuy(l),0);
  const hotro_kt=Math.round(dvdkIBuy*CONFIG.hotroKTDinhKyNoiBo+dvtkOBuy*CONFIG.hotroKTThueNgoai);
  const dvtkISell=d.lines.filter(l=>l.type==='DVTK-I').reduce((s,l)=>s+lineSell(l),0);
  const tkOn=!!(d.form.tk_nv&&d.form.tk_nv!=='Không');
  const trienkhai=tkOn?Math.round(dvtkISell*(cfg.thuongTrienKhai??0.05)):0;
  const duphong=(d.form.dp&&d.form.dp.startsWith('Có'))?Math.round(giavon*(cfg.duphong??0.01)):0;

  let running=laigop_saugg-baohanh-hotro_license-hotro_kt-trienkhai-duphong;
  const tvOn=!!(d.form.tv_nv&&d.form.tv_nv!=='Không');
  const tvRate=tvOn?(cfg.thuongTuVan??0.03)+(d.form.tv_proposal?0.02:0)+(d.form.tv_poc?0.02:0):0;
  const thuong_tuvan=tvOn?Math.round(Math.max(0,running)*tvRate):0;
  const laigop_cuoi=running-thuong_tuvan;

  const nguong=(cfg.nguong??0.08)+Math.max(0,Math.floor((dealCongNo(d)-30)/15))*0.005;
  const chia=computeChia(d,laigop_cuoi);
  const extra={};
  if(d.pl){
    if(d.pl.renew){
      extra.renew={truoc:d.pl.renew.truoc,
        nay:{soHDPO:d.pl.renew.nay.soHDPO,cpbh:cpbanhang,doanhthu:doanhthu,laigop:laigop_cuoi}};
    }
    if(d.pl.ketluan) extra.ketluan=d.pl.ketluan;
  } else if(d.donHangMoi==='Không'&&d.form.renew&&parseNum(d.form.renew.doanhthu_truoc)>0){
    const r=d.form.renew;
    extra.renew={truoc:{soHDPO:r.soHDPO_truoc,cpbh:parseNum(r.cpbh_truoc),doanhthu:parseNum(r.doanhthu_truoc),laigop:parseNum(r.laigop_truoc)},
      nay:{soHDPO:d.soHDPO||d.soHDNoiBo||'—',cpbh:cpbanhang,doanhthu:doanhthu,laigop:laigop_cuoi}};
  }
  return Object.assign({doanhthu,giavon,cpbanhang,cptaichinh,baohanh,hotro_license,hotro_kt,trienkhai,duphong,thuong_tuvan,laigop_cuoi,nguong,chia,
    ref:{jr,rate,hang,tbBuy,licBuy,dvdkIBuy,dvtkOBuy,dvtkISell,tvOn,tvRate,running,cfg,
      tkOn,dpOn:!!(d.form.dp&&d.form.dp.startsWith('Có')),
      congno:dealCongNo(d),ct:dealCt(d),nguongCoSo:(cfg.nguong??0.08)}},extra);
}
function ketQua(d){ if(d.draft) return {k:'wait',t:'Đang tính'}; const p=computePL(d);
  return (p.laigop_cuoi/p.giavon>=p.nguong)?{k:'ok',t:'Đạt'}:{k:'no',t:'Không đạt'}; }
function myLines(d,role){ return d.lines.filter(l=> role==='procure'?isDevLic(l.type):!isDevLic(l.type)); }

const CUS_F=[['cus','Tên khách hàng'],['maKH','Mã khách hàng'],['maSoThue','Mã số thuế'],['diaChi','Địa chỉ'],['nguoiLienHe','Người liên hệ'],['dienThoai','Điện thoại liên hệ'],['email','Email'],['nguoiDaiDien','Người đại diện'],['chucVu','Chức vụ'],['soTaiKhoan','Số tài khoản'],['nganHang','Ngân hàng']];
const DLV_F=[['nguoiNhan','Người nhận hàng'],['sdtNhan','SĐT nhận hàng'],['diaChiNhan','Địa chỉ nhận hàng']];
const CUSL={}; let CUS_HITS=[], CUS_IDX=-1, CUS_FLD='cus';
const cusN=x=>String(x||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/đ/g,'d').replace(/\s+/g,' ').trim();

function customerBook(exceptId){
  const m={};
  DEALS.forEach(x=>{ if(x.id===exceptId||!x.cus||!String(x.cus).trim()) return;
    const k=mstD(x.maSoThue)||cusN(x.cus); const t=pDate(x.date)||0;
    const e=m[k]||(m[k]={n:0,done:0,last:null,t:-1,deals:[]}); e.n++; e.deals.push(x); if(wf(x).stage>=FLOW.length&&!wf(x).lost) e.done++;
    if(t>=e.t){ e.t=t; e.last=x; } });
  return Object.values(m).map(e=>{ const x=e.last, v={}, byT=e.deals.slice().sort((a,b)=>(pDate(b.date)||0)-(pDate(a.date)||0));
    CUS_F.concat(DLV_F).forEach(([k])=>{ const y=byT.find(z=>z[k]&&String(z[k]).trim()); v[k]=y?y[k]:''; });
    const ct={}; byT.forEach(z=>{ if(!z.nguoiLienHe) return; const ck=cusN(z.nguoiLienHe); if(!ct[ck]) ct[ck]={ten:z.nguoiLienHe,sdt:z.dienThoai||'',email:z.email||'',from:z.id,date:z.date}; });

    return {v,hang:(x.form&&x.form.hang)||'',n:e.n,done:e.done,lastId:x.id,lastDate:x.date,am:x.am||'',contacts:Object.values(ct),deals:byT.map(z=>z.id),lineSrc:lineSrc?lineSrc.id:''}; });
}
function curCustomer(d){ const b=customerBook(d.id), md=mstD(d.maSoThue);
  return (md&&b.find(c=>mstD(c.v.maSoThue)===md))||(d.maKH&&b.find(c=>c.v.maKH&&c.v.maKH===d.maKH))||(d.cus&&b.find(c=>cusN(c.v.cus)===cusN(d.cus)))||null; }
// Mã KH gợi ý cho khách hàng mới: viết tắt từ tên, bỏ loại hình doanh nghiệp, không trùng mã đã có
function genMaKH(name,exceptId){
  const stop=/^(cong|ty|co|phan|trach|nhiem|huu|han|tnhh|cp|mtv|jsc|ltd|thuong|mai|dich|vu|va|tm|dv|san|xuat|tap|doan|chi|nhanh|cua|the|of|and)$/;
  const w=cusN(name).replace(/[^a-z0-9 ]/g,' ').split(' ').filter(Boolean); const core=w.filter(x=>!stop.test(x)); const ws=core.length?core:w;
  let base=ws.length>=3?ws.map(x=>x[0]).join(''):ws.join(''); base=base.toUpperCase().slice(0,12); if(base.length<2) base=(base+'KH').slice(0,2);
  const used=new Set(DEALS.filter(x=>x.id!==exceptId).map(x=>x.maKH).filter(Boolean)); let c=base, n=2; while(used.has(c)) c=base+(n++);
  return c; }

    const pool=cc?cc.contacts.map(x=>({c:cc,x})):(q.length>=2?book.flatMap(c=>c.contacts.map(x=>({c,x}))):[]);
    CUS_HITS=pool.filter(h=>!q||cusN(h.x.ten).includes(q)||mstD(h.x.sdt).includes(q.replace(/\D/g,'')||'#')).slice(0,8).map(h=>({kind:'ct',...h}));
    if(!CUS_HITS.length){ box.hidden=!(q.length>=2); box.innerHTML='<div class="sug-empty">Không có người liên hệ cũ khớp — nhập mới.</div>'; return; }

    box.hidden=false; return; }
  const qd=q.replace(/\D/g,''), need=f==='maSoThue'?3:2;
  if((f==='maSoThue'?qd.length:q.length)<need){ box.hidden=true; CUS_HITS=[]; return; }
  const hit=c=>f==='maSoThue'?mstD(c.v.maSoThue).startsWith(qd):f==='maKH'?(cusN(c.v.maKH).includes(q)||cusN(c.v.cus).includes(q)):(cusN(c.v.cus).includes(q)||cusN(c.v.maKH).includes(q)||(qd.length>=4&&mstD(c.v.maSoThue).startsWith(qd)));
  CUS_HITS=book.filter(hit).sort((a,b)=>(cusN(b.v.cus).startsWith(q)-cusN(a.v.cus).startsWith(q))||b.n-a.n).slice(0,6).map(c=>({kind:'cus',c}));
  if(!CUS_HITS.length){ box.innerHTML=`<div class="sug-empty">Không có KH cũ khớp ${SUG_LAB[f]} — sẽ tạo khách hàng mới.${f==='maSoThue'?' Nhập đủ MST để AI tra cứu đăng ký thuế.':f==='cus'?' Mã KH sẽ được gợi ý tự động; có MST thì nhập để AI tra cứu.':''}</div>`; box.hidden=false; return; }
  box.innerHTML=CUS_HITS.map(({c},i)=>`<div class="sug-item" onmousedown="event.preventDefault();kPick(${i})"><div><b>${escH(c.v.cus)}</b>${c.v.maKH?` <span class="faint">· ${escH(c.v.maKH)}</span>`:''}${c.hang?` <span class="tag">${escH(c.hang)}</span>`:''}</div>
    <div class="faint">${[c.v.maSoThue&&'MST '+escH(c.v.maSoThue),c.v.diaChi&&escH(c.v.diaChi)].filter(Boolean).join(' · ')||'—'}</div>
    <div class="faint">${c.n} đơn${c.done?` (${c.done} hoàn tất)`:''} · gần nhất ${escH(c.lastId)} ${escH(c.lastDate||'')}${c.am?' · AM '+escH(c.am):''}${c.contacts.length?' · LH: '+escH(c.contacts[0].ten):''}</div></div>`).join('')

};

window.kKey=function(e,f){ const box=document.getElementById('sug_'+f); if(!box||box.hidden||!CUS_HITS.length){ if(e.key==='Escape'&&box) box.hidden=true; return; }

  DLV_F.forEach(([k,l])=>{ if(c.v[k]&&!String(d[k]||'').trim()){ d[k]=c.v[k]; filled.push(l); } });
  if(c.hang&&d.form&&!d.form.hang){ d.form.hang=c.hang; filled.push('Hạng KH'); }

  wfLog(d,S.role,'done',{task:'Lấy thông tin từ khách hàng cũ',note:`${c.v.cus} · ${why} · nguồn đơn ${c.lastId} (${c.n} đơn)${filled.length?' · điền: '+filled.join(', '):''}`});

function formIssues(d){
  const f=d.form;
  const miss=[];
  if(!f.nguon_kh||((d.donHangMoi||'Có')==='Không'&&f.nguon_kh!=='Không')) miss.push('nguon_kh');
  if(!f.hang) miss.push('hang');
  if(f.congno===undefined||f.congno===null||String(f.congno).trim()==='') miss.push('congno');
  if(f.cpbh===undefined||f.cpbh===null||f.cpbh==='') miss.push('cpbh');
  if(!f.tk_nv) miss.push('tk_nv');
  if(!f.tv_nv) miss.push('tv_nv');
  if(!d.soHDNoiBo||!String(d.soHDNoiBo).trim()) miss.push('soHDNoiBo');
  if(!f.am) miss.push('am');
  if(!d.duAn||!String(d.duAn).trim()) miss.push('duAn');
  if(ctPhase(d)&&(f.lan_tt===undefined||f.lan_tt===null||String(f.lan_tt).trim()==='')) miss.push('lan_tt');
  if(f.dp&&f.dp.startsWith('Có')&&(f.dp_val===undefined||f.dp_val===null||f.dp_val==='')) miss.push('dp_val');
  // 13/–18/ Phân bổ giai đoạn deal: bắt buộc chọn người phụ trách, nhập tỷ lệ, tổng = 100%
  const stg=(f.stages&&f.stages.length)?f.stages:getStages(d);
  stg.forEach((s,i)=>{ if(!s.nv||!String(s.nv).trim()) miss.push('stg_nv_'+i); if(s.pct===undefined||s.pct===null||s.pct===''||isNaN(s.pct)) miss.push('stg_pct_'+i); });
  if(Math.abs(stg.reduce((n,s)=>n+(+s.pct||0),0)-1)>1e-6) miss.push('stg_tong');
  const laDonMoi=(d.donHangMoi||'Có')==='Có';
  if(!laDonMoi){
    const renewD=f.renew||{};
    if(!renewD.soHDPO_truoc||!String(renewD.soHDPO_truoc).trim()||renewD.soHDPO_truoc==='—') miss.push('soHDPO_truoc');
    if(renewD.cpbh_truoc===undefined||renewD.cpbh_truoc===null||renewD.cpbh_truoc==='') miss.push('cpbh_truoc');
    if(renewD.doanhthu_truoc===undefined||renewD.doanhthu_truoc===null||renewD.doanhthu_truoc===''||!(parseNum(renewD.doanhthu_truoc)>0)) miss.push('doanhthu_truoc');
    if(renewD.laigop_truoc===undefined||renewD.laigop_truoc===null||renewD.laigop_truoc==='') miss.push('laigop_truoc');
  }
  return miss;
}

function typeBreakdown(d){
  const g={};
  d.lines.forEach(l=>{
    const vatR=vatValue(l.vatRate===undefined||l.vatRate===null?CONFIG.vat:l.vatRate);
    const bt=lineBuy(l),vB=noVatBuy(l.type)?0:bt*vatR;
    const st=lineSell(l),vS=noVatSell(l.type)?0:st*vatR;
    if(!g[l.type]) g[l.type]={buy:0,buyV:0,sell:0,sellV:0};
    g[l.type].buy+=bt; g[l.type].buyV+=vB; g[l.type].sell+=st; g[l.type].sellV+=vS;
  });
  return g;
}

function pctIn(path,val,width){
  return `<input type="text" class="cell-in" style="max-width:${width||58}px" data-path='${JSON.stringify(path)}' data-kind="pct" value="${String(+(val*100).toFixed(3)).replace('.',',')}" onchange="updCfg(this)">`;
}
function numIn(path,val,width){
  return `<input type="text" class="cell-in" style="max-width:${width||110}px;text-align:right" data-path='${JSON.stringify(path)}' data-kind="num" value="${fmt(val)}" onchange="updCfg(this)">`;
}
function txtIn(path,val,width){
  const style=width==='100%'?'width:100%':`max-width:${width||320}px`;
  return `<input type="text" class="cell-in txt" style="${style}" data-path='${JSON.stringify(path)}' data-kind="txt" value="${val||''}" onchange="updCfg(this)">`;
}

function renderSlaConfig(){

  return `<div class="tbl-wrap"><table class="dtbl"><thead><tr><th>Giai đoạn</th><th>Task</th><th>Vai trò</th><th>Thời hạn (ngày)</th></tr></thead><tbody>

      <td class="num">${numIn(['sla',t.id],taskDays(t),70)}</td></tr>`).join('')).join('')}

window.updCfg=function(el){
  const path=JSON.parse(el.dataset.path);
  let v=el.value;
  if(el.dataset.kind==='pct'){ const n=parseDec(v); v=isNaN(n)?0:n/100; }
  else if(el.dataset.kind==='num') v=parseNum(v);
  else v=normInput(path[path.length-1],v);
  let obj=CONFIG;
  for(let i=0;i<path.length-1;i++) obj=obj[path[i]];
  obj[path[path.length-1]]=v;
  draw();
};
window.resetConfig=function(){ CONFIG=JSON.parse(JSON.stringify(DEFAULT_CONFIG)); draw(); };
window.fillRenew=function(id,prevId){
  const d=dealById(id), x=dealById(prevId); if(!d) return;
  if(!x){ d.form.renew=Object.assign({},d.form.renew,{prevId:''}); draw(); return; }
  const pp=computePL(x);
  d.form.renew={soHDPO_truoc:x.soHDPO||x.soHDNoiBo||x.id,prevId:x.id,cpbh_truoc:pp.cpbanhang,doanhthu_truoc:Math.round(pp.doanhthu),laigop_truoc:Math.round(pp.laigop_cuoi)};
  draw();
};

window.addBacCPTC=function(hk,hi){
  if(!CONFIG.cpTaiChinh) CONFIG.cpTaiChinh={};
  if(!CONFIG.cpTaiChinh[hk]) CONFIG.cpTaiChinh[hk]={duoiNguong:0.20,bac:[]};
  const c=CONFIG.cpTaiChinh[hk];
  if(!c.bac) c.bac=[];
  const tuEl=document.getElementById('newbac_tu_'+hi), rEl=document.getElementById('newbac_r_'+hi);
  const tu=Number((tuEl&&tuEl.value||'').replace(',','.')), r=Number((rEl&&rEl.value||'').replace(',','.'));
  if(isNaN(tu)||isNaN(r)||!tuEl.value||!rEl.value){ alert('Vui lòng nhập đủ ngưỡng và tỷ lệ r (%)'); return; }
  if(r>=100){ alert('Tỷ lệ r phải nhỏ hơn 100%'); return; }
  if(c.bac.some(b=>Math.abs(b.tu-tu/100)<1e-9)){ alert(`Hạng ${hk} đã có bậc ≥ ${tu}%`); return; }
  c.bac.push({tu:tu/100,r:r/100});
  c.bac.sort((a,b)=>a.tu-b.tu);
  draw();
};
window.delBacCPTC=function(hk,i){
  const c=(CONFIG.cpTaiChinh||{})[hk];
  if(!c||!c.bac) return;
  c.bac.splice(i,1); draw();
};
window.addVat=function(kct){
  if(!CONFIG.vatList) CONFIG.vatList=[];
  let val;
  if(kct==='KCT'){ val='KCT'; }
  else{
    const el=document.getElementById('newvat_val');
    const raw=(el&&el.value||'').trim();
    if(raw===''){ alert('Vui lòng nhập mức thuế (%)'); return; }

window.addType=function(){
  const ma=(document.getElementById('newtype_ma').value||'').trim();
  const nhom=document.getElementById('newtype_nhom').value;
  if(!ma){ alert('Vui lòng nhập mã loại'); return; }
  if(TYPES.includes(ma)){ alert('Mã loại "'+ma+'" đã tồn tại'); return; }
  TYPES.push(ma);
  if(nhom==='LIC'){ NOVATSELL.push(ma); NOVATBUY.push(ma); }
  else if(nhom==='LICDK'){ NOVATSELL.push(ma); NOVATBUY.push(ma); PERIODIC.push(ma); }
  else if(nhom==='DVTK'){ SERVICE.push(ma); }
  else if(nhom==='DVDK'){ SERVICE.push(ma); MULMONTHS.push(ma); NOVATBUY.push(ma); }
  else if(nhom==='NN'){ SERVICE.push(ma); MULMONTHS.push(ma); FOREIGN.push(ma); NOVATBUY.push(ma); }

window.delType=function(t){
  const used=DEALS.reduce((n,d)=>n+d.lines.filter(l=>l.type===t).length,0);

  [TYPES,SERVICE,MULMONTHS,FOREIGN,NOVATSELL,NOVATBUY,PERIODIC].forEach(arr=>{

function paymentPlanCell(s,si,editable){
  const dots=getDotTT(s);
  const lastIdx=dots.length-1;
  if(!editable){
    const rows=dots.map((x,di)=>{
      const khi=(di===lastIdx&&di>0&&x.truocNhanHang)?' <small class="faint">(trước khi nhận hàng)</small>':'';
      return `<div class="ttrow-ro"><span class="ttname">${x.ten}</span><span>${pct(x.tyLe)}${khi}</span></div>`;
    }).join('');
    return `<td><div class="ttbox ro">${rows}<div class="ttdiv"></div>
        <div class="ttrow-ro"><span class="ttname">Tất toán</span><b>${pct(ttRemain(s))}</b></div>
        <div class="ttrow-ro"><span class="faint">Công nợ</span><span>${s.congNo??30} ngày</span></div>
      </div></td>`;
  }
  const rows=dots.map((x,di)=>{
    const canTick=(di===lastIdx&&di>0);
    const ticked=canTick&&x.truocNhanHang;
    const khiPart=ticked
      ? `<span class="faint">trước khi nhận hàng</span>`
      : '';
    const tick=canTick
      ? `<label class="ck" title="Thanh toán trước khi nhận hàng"><input type="checkbox" ${ticked?'checked':''} onchange="toggleTruocNhanHang(${si},${di})"> trước khi nhận hàng</label>`
      : '';
    return `<div class="ttrow">
      <span class="ttname">${x.ten}</span>
      <input type="text" class="cell-in" style="max-width:36px" value="${Math.round((x.tyLe||0)*100)}" data-si="${si}" data-di="${di}" data-tf="tyLe" onchange="updTT(this)"><span class="faint">%</span>
      ${khiPart}
      ${dots.length>1?`<button class="btn sm ghost danger" title="Xóa đợt" onclick="delTT(${si},${di})">✕</button>`:'<span style="width:16px;display:inline-block"></span>'}
    </div>${tick?`<div class="ttrow ttrow-tick">${tick}</div>`:''}`;
  }).join('');
  return `<td style="min-width:210px"><div class="ttbox">
      ${rows}
      <button class="btn sm" onclick="addTT(${si})">+ Thêm đợt tạm ứng</button>
      <div class="ttdiv"></div>
      <div class="ttrow ttfinal-row"><span class="ttname">Tất toán</span><b class="num">${pct(ttRemain(s))}</b></div>
      <div class="ttrow ttfinal-row"><span class="faint">Công nợ</span>
        <span><input type="text" class="cell-in" style="max-width:36px" value="${s.congNo??30}" data-si="${si}" onchange="updCongNo(this)"> ngày</span></div>
    </div></td>`;
}

window.wfDo=function(tid,mode){
  const d=activeDeal(), t=TASKS[tid], s=tst(d,t), note=wfNoteVal();
  if(!canDo(t,S.role)||!taskReady(d,t)) return;
  if(t.kind==='submit'&&!submitChecklist(d).every(x=>x.ok)) return;
  if(tid==='t23'&&mode!=='na'&&mhIssues(d).miss.length){ S.wfErr='Nhập Đơn giá mua đề xuất của Mua hàng cho tất cả dòng Thiết bị / License (tab Đơn mua hàng).'; draw(); return; }
  if(CT_TASKS.includes(tid)&&mode!=='na'&&!ctGate(d,t).every(x=>x.ok)){ S.wfErr=tid==='t40'||tid==='t44'?'Cần có dự thảo hợp lệ (và khuyến nghị AI) trước khi trình SD.':'Cần upload bản chính thức hợp lệ và bổ sung các mục còn thiếu.'; draw(); return; }
  const W=mode==='na'?[]:taskWarnings(d,t);
  if(needWhy(W)&&!note){ S.wfNote=note; S.wfErr=tid==='t31'&&ketQua(d).k==='no'?'P&L không đạt ngưỡng — cần ghi lý do duyệt ngoại lệ.':'Có cảnh báo nghiêm trọng của AI / hệ thống — ghi lý do vẫn tiếp tục vào ô ghi chú.'; draw(); return; }
  wfOverride(d,S.role,t.n,W,note);
  s.st=mode==='na'?'na':'done'; s.by=wfActor(d,S.role); s.t=nowStr();
  wfLog(d,S.role,mode==='na'?'na':(t.kind==='approve'?'approve':t.kind==='submit'?'submit':'done'),{task:t.n,note});
  if(t.kind==='submit') wf(d).returned=false;
  wfAdvance(d); wfDoneUI();
};
window.wfReturn=function(tid){
  const d=activeDeal(), t=TASKS[tid], w=wf(d), note=wfNoteVal();
  if(!canDo(t,S.role)||!taskReady(d,t)) return;
  if(!note){ S.wfErr='Vui lòng ghi lý do trả lại để AM biết cần sửa gì.'; draw(); return; }
  wfLog(d,S.role,'return',{task:t.n,note});
  w.stage=0; w.returned=true; w.ts={}; wfDoneUI();
};
window.wfLost=function(){
  const d=activeDeal(), w=wf(d), note=wfNoteVal();

};

const escH=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const extOf=n=>(n.split('.').pop()||'').toLowerCase();
const IMG_EXT=['png','jpg','jpeg','webp','gif'];
const TXT_EXT=['txt','csv','tsv','md','json','eml','html','htm','xml'];
async function extractFile(f){
  const ext=extOf(f.name);
  if(IMG_EXT.includes(ext)||/^image\//.test(f.type)) return {text:'',images:[f]};
  if(ext==='pdf'){
    await loadLib('pdf'); await loadLib('pdfw');
    const pdf=await pdfjsLib.getDocument({data:new Uint8Array(await f.arrayBuffer())}).promise;
    let text=''; const n=Math.min(pdf.numPages,20);
    for(let i=1;i<=n;i++){ const pg=await pdf.getPage(i); const tc=await pg.getTextContent();
      text+=`\n--- Trang ${i} ---\n`+tc.items.map(x=>x.str+(x.hasEOL?'\n':' ')).join(''); }
    if(text.replace(/[\s-]|Trang \d+/g,'').length>80) return {text,images:[]};
    // PDF scan: chụp 3 trang đầu thành ảnh để AI đọc
    const images=[];
    for(let i=1;i<=Math.min(pdf.numPages,3);i++){
      const pg=await pdf.getPage(i), vp=pg.getViewport({scale:1.6});
      const c=document.createElement('canvas'); c.width=vp.width; c.height=vp.height;
      await pg.render({canvasContext:c.getContext('2d'),viewport:vp}).promise;
      images.push(await new Promise(r=>c.toBlob(r,'image/png')));
    }
    return {text:'',images,scanned:true};
  }
  if(ext==='docx'){
    await loadLib('mammoth');
    const r=await mammoth.extractRawText({arrayBuffer:await f.arrayBuffer()});
    return {text:r.value,images:[]};
  }
  if(['xlsx','xls','xlsm'].includes(ext)){
    await loadLib('xlsx');
    const wb=XLSX.read(new Uint8Array(await f.arrayBuffer()),{type:'array'});
    const text=wb.SheetNames.slice(0,8).map(n=>`--- Sheet: ${n} ---\n`+XLSX.utils.sheet_to_csv(wb.Sheets[n],{blankrows:false})).join('\n');
    return {text,images:[]};
  }
  if(TXT_EXT.includes(ext)||/^text\//.test(f.type)){
    let t=await f.text();
    if(ext==='html'||ext==='htm') t=t.replace(/<style[\s\S]*?<\/style>|<script[\s\S]*?<\/script>/gi,'').replace(/<[^>]+>/g,' ');
    return {text:t,images:[]};
  }
  throw new Error('Định dạng chưa hỗ trợ (.'+ext+')');
}
function buildPrompt(docs){

Trả về DUY NHẤT một JSON object đúng cấu trúc sau (giữ nguyên tên khóa):

- Mỗi hàng hóa / dịch vụ là một phần tử trong "dong". "donGiaBan" là đơn giá bán cho khách (số nguyên VNĐ, CHƯA VAT). Nếu tài liệu chỉ có giá đã gồm VAT thì quy về chưa VAT; nếu là USD thì nhân tỷ giá 26000 — ghi rõ giả định trong "ghiChu".

TÀI LIỆU:
${docs}`;
}

const PL_COLS=[['buy',/(don gia mua|gia mua|gia von|don gia von|gia nhap)/],['sell',/(don gia ban|gia ban|don gia)/],['desc',/(hang hoa|dich vu|mo ta|ten hang|san pham|dien giai|noi dung|ten thiet bi)/],
  ['sku',/^(ma hang|sku|part ?number|p ?\/ ?n|ma sp|model)$/],['type',/^(loai|ma loai|loai hang)$/],['unit',/^(dvt|don vi tinh|don vi)$/],['qty',/^(so luong|sl|qty)$/],

function plNorm(k,v){

  const s=xDate(v);
  if(k==='form.hang'){ const n=cusN(s); return /vip|loai i\b|^i$/.test(n)?'VIP — Loại I':/tiem nang|loai ii\b|^ii$/.test(n)?'Tiềm năng — Loại II':/pho thong|loai iii|^iii$/.test(n)?'Phổ thông — Loại III':null; }

  if(k==='form.congno'){ const n=parseNum(s); return isNaN(n)?null:Math.round(n)+' ngày'; }
  if(['form.cpbh','form.dp_val','form.renew.cpbh_truoc','form.renew.doanhthu_truoc','form.renew.laigop_truoc'].includes(k)){ const n=typeof v==='number'?v:parseNum(s); return isNaN(n)?null:Math.round(n); }
  if(k==='form.lan_tt'){ const n=parseNum(s); return n>0?String(Math.round(n)):null; }

  if(['form.tk_nv','form.tv_nv','form.nguon_kh'].includes(k)) return /^khong$/.test(cusN(s))?'Không':(isPerson(s)||s);
  return s;
}
function plGrid(ws){ return XLSX.utils.sheet_to_json(ws,{header:1,raw:true,defval:null,blankrows:true}); }
function plParse(wb){

  wb.SheetNames.slice(0,10).forEach(sn=>{ const G=plGrid(wb.Sheets[sn]);
    // 1) cặp nhãn → giá trị
    G.forEach((row,r)=>(row||[]).forEach((cell,c)=>{ if(typeof cell!=='string') return; const lab=plN(cell); if(!lab||lab.length>60) return;
      const hit=PL_LABELS.find(([k,re])=>!seen.has(k)&&re.test(lab)); if(!hit) return;
      let v=null; for(let j=c+1;j<Math.min(row.length,c+6);j++){ const x=row[j]; if(x===null||String(x).trim()==='') continue; if(typeof x==='string'&&PL_LABELS.some(([,re])=>re.test(plN(x)))) break; v=x; break; }
      if(v===null&&G[r+1]&&G[r+1][c]!==null&&G[r+1][c]!==undefined&&!(typeof G[r+1][c]==='string'&&PL_LABELS.some(([,re])=>re.test(plN(G[r+1][c]))))) v=G[r+1][c];
      const nv=plNorm(hit[0],v); if(nv!==null&&nv!==''){ got[hit[0]]={v:nv,src:'file',at:`${sn}!${XLSX.utils.encode_cell({r,c})}`}; seen.add(hit[0]); } }));
    // 2) bảng danh mục: dòng tiêu đề có cột tên hàng + số lượng + đơn giá
    if(!lines.length) for(let r=0;r<G.length;r++){ const row=G[r]||[], map={};
      row.forEach((cell,c)=>{ if(typeof cell!=='string') return; const n=plN(cell); const m=PL_COLS.find(([k,re])=>map[k]===undefined&&re.test(n)); if(m) map[m[0]]=c; });
      if(map.desc===undefined||map.qty===undefined||(map.sell===undefined&&map.buy===undefined)) continue;
      let blank=0;
      for(let q=r+1;q<G.length&&blank<2;q++){ const x=G[q]||[], desc=x[map.desc];
        if(desc===null||String(desc).trim()===''){ blank++; continue; } blank=0;
        if(/^(tong|cong|total)/.test(cusN(desc))) break;
        const g=k=>map[k]===undefined?null:x[map[k]];
        const qty=parseNum(String(g('qty')??'')), sell=typeof g('sell')==='number'?g('sell'):parseNum(String(g('sell')??'')), buy=typeof g('buy')==='number'?g('buy'):parseNum(String(g('buy')??''));
        if(!(qty>0)&&!(sell>0)) continue;
        const tp=String(g('type')??'').trim().toUpperCase();
        lines.push({desc:String(desc).trim(),sku:String(g('sku')??'').trim(),unit:String(g('unit')??'').trim(),qty:qty>0?qty:1,sell:sell>0?sell:0,buy:buy>0?buy:0,
          discount:parseNum(String(g('discount')??''))||0,m:parseNum(String(g('m')??''))||0,nccCty:String(g('nccCty')??'').trim(),coCq:/^c/i.test(String(g('coCq')??''))?'Có':'',
          type:TYPES.includes(tp)?tp:'',_at:`${sn}!${XLSX.utils.encode_cell({r:q,c:map.desc})}`}); }
      if(lines.length) break; }
    // 3) mục 13/–18/ giai đoạn deal: tên giai đoạn + người phụ trách + tỷ lệ trên cùng dòng
    G.forEach(row=>{ (row||[]).forEach((cell,c)=>{ if(typeof cell!=='string') return; const raw=cusN(cell), m=raw.match(/^(1[3-8])\s*[\/.)]/);

        if(typeof x==='number'){ if(pct===null) pct=x>1?x/100:x; } else { const p=isPerson(x); if(p&&!nv) nv=p; else if(/%$/.test(String(x).trim())&&pct===null) pct=parseNum(String(x))/100; } }
      if(nv||pct!==null) stages[idx]={nv,pct}; }); });
  });
  return {got,lines,stages};
}
function plDump(wb){ return wb.SheetNames.slice(0,8).map(n=>`--- Sheet: ${n} ---\n`+XLSX.utils.sheet_to_csv(wb.Sheets[n],{blankrows:false})).join('\n').slice(0,150000); }

function plMissing(d){

    else if(fm[k]) F(k,fm[k][0],fm[k][1],fm[k][2],fm[k][3]); else F(k,k,null,'note'); });
  return out;
}

const pad2=n=>String(n).padStart(2,'0');

  const y=d.getUTCFullYear(); return [y,Math.ceil(((d-Date.UTC(y,0,1))/864e5+1)/7)]; }

}
function pLabel(type,key,short){
  if(type==='all'||!key) return 'Toàn bộ thời gian';

  if(type==='quarter'){ const [y,q]=key.split('-Q'); return `Q${q}/${y}`; }
  if(type==='month'){ const [y,m]=key.split('-'); return short?`T${+m}/${y.slice(2)}`:`Tháng ${+m}/${y}`; }
  if(type==='week'){ const [y,w]=key.split('-W'); const s=weekStart(+y,+w), e=new Date(s); e.setDate(e.getDate()+6);
    const f=x=>pad2(x.getDate())+'/'+pad2(x.getMonth()+1); return short?`T${+w}`:`Tuần ${+w}/${y} (${f(s)}–${f(e)})`; }
  return key;
}
function pPrev(type,key){
  if(type==='year') return ''+(+key-1);

  if(type==='month'){ let [y,m]=key.split('-').map(Number); m--; if(!m){m=12;y--;} return y+'-'+pad2(m); }

function fmtB(n){ if(n===null||n===undefined||isNaN(n)) return '—'; const a=Math.abs(n);

function delta(cur,prev,isPct){
  if(prev===null||prev===undefined) return '';
  if(isPct){ const dp=(cur-prev)*100; if(!isFinite(dp)) return ''; return `<span class="dl ${dp>=0?'up':'dn'}">${dp>=0?'▲':'▼'} ${Math.abs(dp).toFixed(1).replace('.',',')} điểm</span>`; }
  if(!prev) return cur?'<span class="dl up">▲ mới</span>':'';
  const r=(cur-prev)/Math.abs(prev); return `<span class="dl ${r>=0?'up':'dn'}">${r>=0?'▲':'▼'} ${Math.abs(r*100).toFixed(1).replace('.',',')}%</span>`;
}

function kpiOf(name,role,per){
  // Thực đạt = đơn đã HOÀN TẤT; Dự kiến = mọi đơn chưa hoàn tất (trừ Close-lost) — hiển thị nhạt, chưa tính vào % KPI
  per=per||kpiPeriod();
  const inP=d=>pKey(per.type,pDate(d.date))===per.key;
  const mine=d=>role==='sadmin'?(d.sa===name):role==='any'?(d.am===name||d.sa===name||(d.form&&d.form.am===name)):(d.am===name||(d.form&&d.form.am===name));
  const isDone=d=>wf(d).stage>=FLOW.length;
  const all=DEALS.filter(d=>inP(d)&&!wf(d).lost&&mine(d));
  const own=all.filter(isDone), exp=all.filter(d=>!isDone(d));
  const sPL=(arr,k)=>arr.reduce((t,d)=>t+computePL(d)[k],0);
  const thuongDeals=[]; let thuong=0, thuongX=0;
  DEALS.filter(d=>inP(d)&&!wf(d).lost).forEach(d=>{ const c=(computePL(d).chia||[]).find(x=>x.ai===name); if(c&&c.tien){ const dn=isDone(d); if(dn) thuong+=c.tien; else thuongX+=c.tien; thuongDeals.push({d,v:c.tien,role:c.role,done:dn}); } });
  // KPI giao = mốc theo QUÝ (Cấu hình › KPI được giao & thưởng theo quý); kỳ khác quy đổi: năm ×4 · tháng ÷3 · tuần ×4/52
  const q=kpiQOf(name), qf={year:4,quarter:1,month:1/3,week:4/52}[per.type]||4;
  const tgt=q.kpi>0?{th:q.kpi*qf,min:q.min*qf,logo:(q.logoKpi||0)*qf}:null;
  const logo=newLogos(name,per), logoSet=new Set();
  exp.forEach(d=>{ if((d.donHangMoi||'Có')==='Có'&&(d.am===name||(computePL(d).chia||[]).some(c=>c.ai===name&&c.tien))) logoSet.add(d.maKH||d.cus); });
  const logoX=logoSet.size;

    n:own.length,nX:exp.length,thuong,thuongX,thuongDeals,tgt,logo,logoX};
}

// ---------- Mốc KPI & thưởng theo quý ----------
function kpiQOf(name){
  if(!CONFIG.kpiQ) CONFIG.kpiQ={};
  let q=CONFIG.kpiQ[name];
  if(!q){ const k=(CONFIG.kpi||{})[name]||{}, pos=k.role==='sadmin'?'is':'am', kv=Math.round((k.thuong||0)/4/1e6)*1e6;
    q=CONFIG.kpiQ[name]={pos,min:Math.round(kv*0.75/1e6)*1e6,kpi:kv,logoMin:pos==='am'?1:0,logoKpi:pos==='am'?2:0}; }
  return q;
}
// Bậc thưởng lũy tiến: [tối thiểu → KPI) · [KPI → KPI×(1+bước)) · mỗi bước vượt tiếp theo +rStep; bonus quý trước cộng vào mọi bậc từ mức tối thiểu; trần = cap
function kpiBrackets(minV,kpiV,pol,bonusOn,actual){
  const b=[], cap=pol.cap>0?pol.cap:Infinity, add=bonusOn?(pol.bonus||0):0, rate=r=>Math.min(cap,r+add);
  if(kpiV>minV) b.push({lv:'min',from:minV,to:kpiV,r:rate(pol.rMin||0)});
  const st=Math.max(0.01,pol.step||0.5)*kpiV; let lo=kpiV, k=0;
  const top=Math.max(actual||0,kpiV*(1+(pol.step||0.5)));
  while(lo<top+1&&k<40){ b.push({lv:k?'over':'kpi',k,from:lo,to:lo+st,r:rate((pol.rKpi||0)+k*(pol.rStep||0))}); lo+=st; k++; }
  b.at(-1).to=Infinity;
  return b;
}
function kpiBonusCalc(actual,minV,kpiV,pol,bonusOn,logo,logoMin,logoKpi){
  const okMin=logo>=(logoMin||0), okKpi=logo>=(logoKpi||0);
  const rows=kpiBrackets(minV,kpiV,pol,bonusOn,actual).map(x=>{
    const allowed=x.lv==='min'?okMin:okKpi, base=Math.max(0,Math.min(actual,x.to)-x.from);
    return {...x,base,allowed,amt:allowed?base*x.r:0}; }).filter(x=>x.base>0);
  const bonus=rows.reduce((t,x)=>t+x.amt,0);
  let lv='Dưới mức tối thiểu', cls='bad';
  if(actual>=kpiV&&okKpi){ const over=kpiV?actual/kpiV-1:0; lv=over>=(pol.step||0.5)?`Vượt KPI +${Math.round(over*100)}%`:'Đạt KPI'; cls='good'; }
  else if(actual>=minV&&okMin){ lv='Đạt mức tối thiểu'; cls='warn'; }
  else if(actual>=minV){ lv='Đủ LN, thiếu new logo'; cls='bad'; }
  const logoMiss=(actual>=minV&&!okMin)||(actual>=kpiV&&!okKpi);
  return {bonus,rows,lv,cls,okMin,okKpi,logoMiss,reachedKpi:actual>=kpiV&&okKpi};
}
function newLogos(name,per){
  const set=new Set();
  DEALS.forEach(d=>{ if(pKey(per.type,pDate(d.date))!==per.key||wf(d).lost||wf(d).stage<FLOW.length) return;
    if((d.donHangMoi||'Có')!=='Có') return;
    const inChia=(computePL(d).chia||[]).some(c=>c.ai===name&&c.tien);
    if(inChia||d.am===name) set.add(d.maKH||d.cus); });
  return set.size;
}
// Chuỗi 4 quý trong năm: thiếu KPI → cộng phần thiếu vào mốc quý sau; đạt/vượt KPI → quý sau +bonus% cho mọi bậc từ mức tối thiểu
function kpiQuarterChain(name,year){
  const q=kpiQOf(name), pol=(CONFIG.kpiPolicy||{})[q.pos]||DEFAULT_CONFIG.kpiPolicy.am;
  const now=new Date(), curKey=pKey('quarter',now); let carry=0, bonusOn=false; const out=[];
  for(let i=1;i<=4;i++){
    const key=year+'-Q'+i, per={type:'quarter',key}, future=key>curKey;
    const k=kpiOf(name,'any',per), actual=k.thuong, logo=newLogos(name,per);
    const minV=(q.min||0)+carry, kpiV=(q.kpi||0)+carry;
    const c=kpiBonusCalc(actual,minV,kpiV,pol,bonusOn,logo,q.logoMin,q.logoKpi);
    out.push({key,i,future,running:key===curKey,actual,expv:k.thuongX,logo,minV,kpiV,overV:kpiV*(1+(pol.step||0.5)),carryIn:carry,bonusIn:bonusOn,...c,pol,deals:k.thuongDeals});
    if(future) continue;
    if(key!==curKey){ carry=Math.max(0,kpiV-actual); bonusOn=c.reachedKpi; }
  }
  return {q,pol,rows:out,total:out.reduce((t,r)=>t+r.bonus,0)};
}

const MIX=[
  {k:'once',n:'Doanh thu 1 lần',kids:[
    {k:'tb',n:'Hàng hóa',c:1,subs:[[['TB'],'Thiết bị'],[['LIC'],'License 1 lần']]},
    {k:'dvtk',n:'Dịch vụ triển khai',c:2,subs:[[['DVTK-I'],'Nội bộ'],[['DVTK-O'],'Thuê ngoài']]}]},
  {k:'rec',n:'Doanh thu định kỳ',kids:[
    {k:'lic',n:'License định kỳ',c:3,subs:[[['LIC-DK'],'License định kỳ'],[['LIC-NTNN'],'License-NTNN']]},
    {k:'dvi',n:'Dịch vụ định kỳ – nội bộ',c:4,subs:[[['Cloud Server'],'Cloud Server'],[['Veeam'],'Cloud Backup / DR'],[['Colocation'],'Colocation'],[['Manage Service'],'Manage / Maintenance Service'],[['DVDK-I','Other Services','*'],'Khác']]},
    {k:'dvo',n:'Dịch vụ định kỳ – thuê ngoài',c:5,subs:[[['DVDK-O'],'DVĐK thuê ngoài']]},

function mixPath(t){ // loại → [l1,l2,sub index]
  for(const a of MIX) for(const b of a.kids) for(let i=0;i<b.subs.length;i++) if(b.subs[i][0].includes(t)) return [a,b,i];
  // loại do Admin thêm: định kỳ → DV nội bộ "Khác"; dịch vụ 1 lần → DV triển khai; còn lại → Hàng hóa
  const B=k=>{ for(const a of MIX) for(const b of a.kids) if(b.k===k) return [a,b]; };
  if(isTMDK(t)) { const [a,b]=B('lic'); return [a,b,0]; }
  if(noVatSell(t)) { const [a,b]=B('tb'); return [a,b,1]; }
  if(mulMonths(t)) { const [a,b]=B('dvi'); return [a,b,4]; }
  if(isSvc(t)) { const [a,b]=B('dvtk'); return [a,b,0]; }
  const [a,b]=B('tb'); return [a,b,0];
}
// Chi phí ngoài giá vốn = đủ các khoản trừ trong P&L → Tổng chi phí = Doanh thu − LN thuần
const COST_GRP=[
  {k:'bhtc',n:'Chi phí bán hàng &amp; tài chính',cls:'fam3',items:[{k:'cpbh',n:'Chi phí bán hàng'},{k:'cptc',n:'Chi phí tài chính'}]},
  {k:'oth',n:'Chi phí khác',cls:'fam4',items:[{k:'bh',n:'Chi phí bảo hành'},{k:'hlic',n:'Chi phí hỗ trợ license'},{k:'hkt',n:'Chi phí hỗ trợ kỹ thuật'},{k:'tk',n:'Thưởng triển khai'},{k:'tv',n:'Thưởng tư vấn'},{k:'dp',n:'Chi phí dự phòng'}]}];
function mixTree(mode){
  const byT=(m,pred,key)=>{ let s=0; Object.entries(m.byType).forEach(([t,x])=>{ if(pred(mixPath(t))) s+=x[key]; }); return s; };
  const key=mode==='cost'?'buy':'sell';
  const node=(k,n,cls,pred,subs)=>({k,n,cls,f:m=>byT(m,pred,key),g:m=>byT(m,pred,'sell')-byT(m,pred,'buy'),subs:subs||[]});
  const tree=MIX.map((a,ai)=>Object.assign(node(a.k,mode==='cost'?a.n.replace('Doanh thu','Giá vốn'):a.n,'fam'+(ai+1),p=>p[0]===a),{
    kids:a.kids.map(b=>node(b.k,b.n,'s'+b.c,p=>p[1]===b,b.subs.length>1?b.subs.map((sx,i)=>node(b.k+i,sx[1],'',p=>p[1]===b&&p[2]===i)):[]))}));
  let vi=0;
  if(mode==='cost') COST_GRP.forEach(g=>tree.push({k:g.k,n:g.n,cls:g.cls,f:m=>g.items.reduce((s,c)=>s+(m[c.k]||0),0),
    kids:g.items.map(c=>({k:c.k,n:c.n,cls:'v'+(++vi),f:m=>m[c.k]||0,subs:[]}))}));
  return tree;
}

  const pipeAll=VD.filter(amF).filter(d=>inPeriod(d,S.pType,S.pKey)).map(dealMetrics);

  const warnNo=cur.filter(m=>m.ok==='no'), warnNeg=cur.filter(m=>m.ln<0), warnCn=cur.filter(m=>m.congno>=60);
  DRILL_FN.w_no=()=>({title:'Đơn không đạt ngưỡng P&L — '+lbl,sub:scopeName,rows:warnNo.map(m=>({m,v:m.dt?m.ln/m.dt:0})),col:'Biên LN thuần',fmt:v=>pct(v)});

  DRILL_FN.w_ov=()=>({title:'Đơn có cảnh báo AI / hệ thống bị bỏ qua — '+lbl,sub:'Mọi đơn tạo trong kỳ · chi tiết từng lần ở Lịch sử xử lý của đơn',rows:warnOv.map(m=>({m,v:ovCount(m.d)})),col:'Lần bỏ qua',fmt:v=>v+' lần'});
  DRILL_FN.w_cn=()=>({title:'Đơn công nợ ≥ 60 ngày — '+lbl,sub:scopeName,rows:warnCn.map(m=>({m,v:m.congno})),col:'Công nợ',fmt:v=>v+' ngày'});

    <button class="alert info dw" onclick="drill('w_cn')"><b>${warnCn.length}</b><span class="grow">đơn công nợ ≥ 60 ngày</span><span class="num">${fmtB(sumBy(warnCn,m=>m.dt))} DT</span></button>`;

  const scopeSel=`<select class="auto" onchange="setLF('dScope',this.value)" aria-label="Phạm vi đơn">${SCOPES.map(([k,n])=>`<option value="${k}" ${k===(S.dScope||'approved')?'selected':''}>${n}</option>`).join('')}</select>`;
  const sec=(title,sub,body,flush)=>`<section class="panel"><div class="panel-h"><h2>${title}</h2>${sub?`<span class="sub">${sub}</span>`:''}</div><div class="panel-b${flush?' flush':''}">${body}</div></section>`;

  const grp=(n,t,sub)=>`<div class="dgrp"><span class="dgn">${n}</span><h3>${t}</h3>${sub?`<span class="faint">${sub}</span>`:''}</div>`;
  const plSec=`<section class="panel"><div class="panel-h"><h2>Báo cáo kết quả kinh doanh chi tiết</h2><span class="sub">từ doanh thu đến LN thuần · bấm dòng để xem đơn</span><span class="spacer"></span>
      <button class="btn sm ghost" onclick="togglePlFull()">${S.plFull?'▾ Thu gọn':'▸ Mở bảng'}</button></div>${S.plFull?`<div class="panel-b flush"><div class="tbl-wrap">${plTable}</div></div>`:''}</section>`;
  return `${periodBar(VD,scopeSel+amSelect(VD))}

    ${grp('1','Tổng quan &amp; KPI',PLN?`kế hoạch: ${PLN.src}`:'chưa có kế hoạch — Admin nhập ở Cấu hình hệ thống')}
    <div class="dks dks5">${tiles}</div>
    ${renderMyKpiStrip()}

    ${renderTeamKpi()}

      ${sec('Theo loại hợp đồng','',`<div class="tbl-wrap">${groupTable('ct','Loại hợp đồng',m=>m.ct)}</div>`,true)}

// ---------- Hợp đồng: upload dẫn chứng + AI bóc tách ----------
// Hợp đồng > 20 triệu bắt buộc upload file trước khi hoàn thành task Ký HĐ KH (t41) / Ký HĐ NCC (t45).
// Các trường lấy được từ hợp đồng (địa chỉ KH, giao nhận, ngày ký, số lần thanh toán…) KHÔNG bắt buộc lúc lập đơn,
// mà bắt buộc khi hoàn thành bước Ký hợp đồng khách hàng.
const CT_MIN=20000000;
function ctPhase(d){ return !!(d&&d.wf&&d.wf.v===2&&d.wf.stage>=3); }
const CT_KH_FIELDS=[
  {k:'cus',l:'Tên khách hàng',path:['cus'],req:true},
  {k:'maSoThue',l:'Mã số thuế',path:['maSoThue']},
  {k:'diaChi',l:'Địa chỉ',path:['diaChi'],req:true,wide:true},
  {k:'nguoiDaiDien',l:'Người đại diện',path:['nguoiDaiDien']},
  {k:'chucVu',l:'Chức vụ',path:['chucVu']},
  {k:'soTaiKhoan',l:'Số tài khoản',path:['soTaiKhoan']},
  {k:'nganHang',l:'Ngân hàng',path:['nganHang']},
  {k:'soHDPO',l:'Số HĐ / PO',path:['soHDPO'],req:true},
  {k:'ngayHDPO',l:'Ngày ký',path:['ngayHDPO']},
  {k:'congno',l:'Số ngày công nợ',path:['form','congno']},
  {k:'lan_tt',l:'Số lần thanh toán',path:['form','lan_tt'],req:true},
  {k:'nguoiNhan',l:'Người nhận hàng',path:['nguoiNhan'],ship:true},
  {k:'sdtNhan',l:'SĐT nhận hàng',path:['sdtNhan'],ship:true},
  {k:'diaChiNhan',l:'Địa chỉ nhận hàng',path:['diaChiNhan'],ship:true,wide:true},
];
const getP=(o,p)=>p.reduce((x,k)=>x==null?x:x[k],o);
const setP=(o,p,v)=>{ let x=o; for(let i=0;i<p.length-1;i++) x=x[p[i]]=x[p[i]]||{}; x[p[p.length-1]]=v; };
function ctOf(d){ if(!d.contracts) d.contracts={kh:{},ncc:null}; if(!d.contracts.ncc) d.contracts.ncc=defaultNccContracts(d); return d.contracts; }
function defaultNccContracts(d){
  const m={}; (d.lines||[]).filter(l=>isDevLic(l.type)).forEach(l=>{ const n=nccMHval(l)||'(chưa có NCC)'; m[n]=(m[n]||0)+lineBuyMH(l); });
  return Object.entries(m).map(([ten,v])=>({ten,value:Math.round(v),file:null}));
}
const shipNeeded=d=>(d.lines||[]).some(l=>l.type==='TB');
const CT_TASKS=['t40','t44','t41','t45'];
function slotOf(d,kind,i,slot){ const c=ctOf(d), base=kind==='kh'?c.kh:c.ncc[i]; return slot==='dft'?(base.dft||(base.dft={})):base; }
const chkBad=o=>o&&o.chk?o.chk.items.filter(x=>x.lv==='bad').length:0;
function ctGate(d,t){
  const c=ctOf(d), out=[], v=sumSell(d), need=v>CT_MIN, df=c.kh.dft||{};
  if(t.id==='t40'){
    out.push({ok:!need||!!df.file,t:need?(df.file?`Có dự thảo HĐ khách hàng (${escH(df.file.name)})`:`Chưa có dự thảo — bấm "✦ Soạn bằng AI" hoặc upload (giá trị ${fmtB(v)} > 20 triệu)`):'HĐ ≤ 20 triệu — dự thảo không bắt buộc'});
    if(df.file&&df.chk){ const nb=chkBad(df); out.push({ok:!nb||!!df.chk.override,t:nb?(df.chk.override?'AI kiểm tra dự thảo: có lỗi, đã xác nhận':`AI kiểm tra dự thảo: ${nb} lỗi`):'AI kiểm tra dự thảo: đúng bên, khớp giá trị'}); }
    if(df.file) out.push({ok:!!c.kh.review,t:c.kh.review?`AI đã rà soát điều khoản · khuyến nghị “${CT_RV[c.kh.review.ketLuan].t}”`:'Chưa chạy AI rà soát điều khoản để trình Sales Director'});
  }
  if(t.id==='t44'){
    if(!c.ncc.length) out.push({ok:false,t:'Chưa có nhà cung cấp nào — thêm NCC'});
    c.ncc.forEach(r=>{ const nd=(r.value||0)>CT_MIN, x=r.dft||{};
      out.push({ok:!nd||!!x.file,t:`${escH(r.ten)} · ${fmtB(r.value||0)} — ${nd?(x.file?'có dự thảo':'chưa có dự thảo (> 20 triệu)'):'≤ 20 triệu, không bắt buộc'}`});
      if(x.file&&chkBad(x)) out.push({ok:!!x.chk.override,t:`${escH(r.ten)} — AI kiểm tra dự thảo: ${chkBad(x)} lỗi${x.chk.override?' · đã xác nhận':''}`}); });
  }
  if(t.id==='t41'){
    out.push({ok:!need||!!c.kh.file,t:need?(c.kh.file?`Đã upload bản chính thức (${escH(c.kh.file.name)})`:`Chưa upload bản chính thức có chữ ký — bắt buộc vì giá trị ${fmtB(v)} > 20 triệu`):'HĐ ≤ 20 triệu — không bắt buộc upload'});
    if(c.kh.file&&c.kh.chk){ const nb=chkBad(c.kh); out.push({ok:!nb||!!c.kh.chk.override,t:nb?(c.kh.chk.override?'AI kiểm tra bản chính thức: có lỗi / lệch dự thảo, đã xác nhận':`AI kiểm tra bản chính thức: ${nb} lỗi / lệch dự thảo`):'AI kiểm tra bản chính thức: hợp lệ, khớp dự thảo đã duyệt'}); }
    const miss=CT_KH_FIELDS.filter(f=>(f.req||(f.ship&&shipNeeded(d)))&&!String(getP(d,f.path)??'').trim());
    out.push({ok:!miss.length,t:miss.length?`Còn thiếu: ${miss.map(f=>f.l).join(', ')}`:'Đủ thông tin khách hàng / hợp đồng / giao nhận'});
    const fe=dealFormatIssues(d); out.push({ok:!fe.length,t:fe.length?`Sai định dạng (${fe.length}): ${fe.slice(0,6).join(', ')}${fe.length>6?'…':''} — xem ô viền đỏ`:'Dữ liệu đúng định dạng'});
  }
  if(t.id==='t45'){
    c.ncc.forEach(r=>{ const nd=(r.value||0)>CT_MIN;
      out.push({ok:!nd||!!r.file,t:`${escH(r.ten)} · ${fmtB(r.value||0)} — ${nd?(r.file?'đã upload bản chính thức':'chưa upload bản chính thức (> 20 triệu)'):'≤ 20 triệu, không bắt buộc'}`});
      if(r.file&&chkBad(r)) out.push({ok:!!r.chk.override,t:`${escH(r.ten)} — AI kiểm tra bản chính thức: ${chkBad(r)} lỗi / lệch dự thảo${r.chk.override?' · đã xác nhận':''}`}); });
  }
  return out;
}

      ${c.ncc.map((r,i)=>{ const x=r.dft||{}, tag=o=>o.chk?(()=>{ const nb=chkBad(o), nw=o.chk.items.filter(y=>y.lv==='warn').length; return `<span class="tag ${nb?(o.chk.override?'warn':'bad'):nw?'warn':'good'}">${nb?(o.chk.override?'đã xác nhận':nb+' lỗi'):nw?nw+' lưu ý':'hợp lệ'}</span>`; })():'';

    if(full||t) s.push(cs[t]+' trăm');

function aiClassify(l){
  const t=((l.desc||'')+' '+(l.sku||'')).toLowerCase(), ncc=(l.nccCty||'').toLowerCase();
  const mo=(t.match(/(\d+)\s*tháng/)||[])[1], yr=(t.match(/(\d+)\s*năm/)||[])[1];
  const months=mo?+mo:yr?+yr*12:12;
  const nn=/nước ngoài|\bnn\b|quốc tế|overseas|global/.test(t+' '+ncc);
  const lic=l.unit==='Bản quyền'||/license|licence|bản quyền|subscription|microsoft 365|office 365|\bm365\b|windows server|\bltsc\b|vsphere|vmware|adobe|fortiguard|forticare|kaspersky|eset|antivirus|hikcentral|replication/.test(t);
  const period=/thuê bao|subscription|gia hạn|renew|\d+\s*(tháng|năm)|hàng năm|annual|microsoft 365|office 365|\bm365\b|fortiguard|forticare/.test(t);
  const perp=/vĩnh viễn|perpetual|\boem\b|\bltsc\b/.test(t);
  const intern=/nội bộ|terabox/.test(ncc);
  let s={}, why='';
  if(lic&&!/cloud backup|cloud server/.test(t)){
    if(nn){ s.type='LIC-NTNN'; why='License mua từ nhà cung cấp nước ngoài → chịu thuế NTNN, có kỳ hạn'; }
    else if(period&&!perp){ s.type='LIC-DK'; why=`License thuê bao / gia hạn${mo||yr?` ${months} tháng`:''} → Thương mại định kỳ (TMDK), cần ngày hiệu lực`; }
    else { s.type='LIC'; why=perp?'License vĩnh viễn (perpetual / OEM / LTSC) → mua 1 lần':'License không thấy kỳ hạn → mặc định mua 1 lần'; }
    s.unit='Bản quyền';
  }else if(/saas/.test(t)||(nn&&/dịch vụ|service/.test(t))){ s.type='DVDK-NTNN'; s.unit='Tháng'; s.m=months; why='Dịch vụ thuê bao của nhà cung cấp nước ngoài, tính theo tháng'; }
  else if(/cloud server|\bvps\b|vcpu|máy chủ ảo/.test(t)){ s.type='Cloud Server'; s.unit='Tháng'; s.m=months; why='Máy chủ ảo cho thuê, tính phí theo tháng'; }
  else if(/colocation|chỗ đặt máy|thuê rack|\b\d+u\b/.test(t)){ s.type='Colocation'; s.unit='Tháng'; s.m=months; why='Thuê chỗ đặt máy chủ, tính theo tháng'; }
  else if(/cloud backup|backup.*cloud|\bdr\b|disaster|sao lưu/.test(t)){ s.type='Veeam'; s.unit='Tháng'; s.m=months; why='Dịch vụ sao lưu / DR trên cloud, tính theo tháng'; }
  else if(/manage service|managed|vận hành|giám sát|bảo trì định kỳ|maintenance/.test(t)){ s.type='Manage Service'; s.unit='Tháng'; s.m=months; why='Dịch vụ vận hành / bảo trì định kỳ, tính theo tháng'; }
  else if(/triển khai|lắp đặt|cài đặt|cấu hình|thi công|di chuyển dữ liệu|đào tạo|khảo sát|nhân công|bàn giao/.test(t)){
    s.type=intern?'DVTK-I':'DVTK-O'; s.unit=l.unit||'Gói'; why=`Dịch vụ triển khai 1 lần, ${intern?'TeraBox tự làm':'thuê '+(l.nccCty||'đơn vị ngoài')}`; }
  else{
    s.type='TB'; why='Hàng hóa phần cứng → thiết bị (VAT 2 chiều, có bảo hành)';
    if(!(parseNum(l.m)>0)){ s.m=/máy chủ|server|storage|\bnas\b|ổ cứng|hdd|ssd/.test(t)?36:/camera|nvr|đầu ghi|switch|firewall|router|màn hình|tivi|led/.test(t)?24:12; why+=`; bảo hành phổ biến ${s.m} tháng`; }
    if(!l.coCq) s.coCq='Có';

  }

}
function aicDiff(l,s){
  const out=[];
  if(s.type&&s.type!==l.type) out.push(['type',l.type||'—',s.type]);
  if(s.unit&&(s.type!==l.type||!l.unit)&&s.unit!==l.unit) out.push(['unit',l.unit||'—',s.unit]);
  if(s.m!=null&&parseNum(l.m)!==s.m&&(s.type!==l.type||!(parseNum(l.m)>0))) out.push(['m',l.m||'—',s.m]);
  if(s.coCq&&!l.coCq) out.push(['coCq','—',s.coCq]);
  return out;
}
const AIC_F={type:'Loại',unit:'ĐVT',m:'Thời hạn / BH (tháng)',coCq:'CO/CQ'};
function aicRun(d,useAI){

  d.lines.forEach((l,i)=>{ const r=aiClassify(l), df=aicDiff(l,r.sug); if(df.length){ st.res.push({i,sug:r.sug,why:r.why,df}); st.sel[i]=true; } });
  if(!useAI) return;
}

// ---- (3) Cảnh báo P&L trước khi gửi duyệt ----
const plRatio=d=>{ const p=computePL(d); return {p,ok:p.giavon>0&&p.laigop_cuoi/p.giavon>=p.nguong,r:p.giavon?p.laigop_cuoi/p.giavon:0}; };
const cloneDeal=d=>JSON.parse(JSON.stringify(d));
function bsearch(lo,hi,okAt,wantMax){ // tìm ngưỡng nhỏ nhất (hoặc lớn nhất) thỏa okAt
  if(wantMax){ if(!okAt(lo)) return null; for(let k=0;k<40;k++){ const m=(lo+hi)/2; if(okAt(m)) lo=m; else hi=m; } return lo; }
  if(!okAt(hi)) return null; for(let k=0;k<40;k++){ const m=(lo+hi)/2; if(okAt(m)) hi=m; else lo=m; } return hi;
}
function lineKey(desc){ return String(desc||'').toLowerCase().replace(/\(.*?\)/g,'').replace(/[^a-zà-ỹđ0-9 ]/gi,' ').split(/\s+/).filter(Boolean).slice(0,3).join(' '); }
function buyHistory(d,l){
  const k=lineKey(l.desc), xs=[];
  DEALS.forEach(x=>{ if(x===d||x.draft) return; x.lines.forEach(y=>{ if(y.type===l.type&&lineKey(y.desc)===k&&parseNum(y.buy)>0) xs.push(parseNum(y.buy)); }); });
  if(xs.length<2) return null; xs.sort((a,b)=>a-b); return {n:xs.length,med:xs[Math.floor(xs.length/2)],min:xs[0]};
}
function plCheck(d){
  const {p,ok,r}=plRatio(d), items=[], fixes=[];
  if(!(p.doanhthu>0)) return {p,ok:false,r:0,items:[{lv:'warn',t:'Chưa có dòng hàng nào để tính P&L'}],fixes};
  const gap=p.nguong*p.giavon-p.laigop_cuoi;
  items.push(ok?{lv:'ok',t:`LN thuần ${fmtB(p.laigop_cuoi)} = ${pct(r)} giá vốn, đạt ngưỡng ${pct(p.nguong)}`}
    :{lv:'bad',t:`LN thuần ${fmtB(p.laigop_cuoi)} = ${pct(r)} giá vốn, dưới ngưỡng ${pct(p.nguong)} — còn thiếu ${fmtB(gap)}`});
  const loss=[], thin=[], noBuy=[], hist=[];
  d.lines.forEach((l,i)=>{ const s=lineSell(l), b=lineBuy(l), m=s?(s-b)/s:0;
    if(b>0&&s<b) loss.push(`#${i+1} ${l.desc} (lỗ ${fmtB(b-s)})`);
    else if(b>0&&m<0.05) thin.push(`#${i+1} ${l.desc} (${pct(m)})`);
    if(!(parseNum(l.buy)>0)&&!/nội bộ|terabox/i.test(l.nccCty||'')&&l.type!=='DVTK-I') noBuy.push(`#${i+1} ${l.desc}`);
    const h=buyHistory(d,l); if(h&&parseNum(l.buy)>0&&Math.abs(parseNum(l.buy)/h.med-1)>0.2) hist.push(`#${i+1} ${l.desc}: ${fmtB(parseNum(l.buy))} so với trung vị ${fmtB(h.med)} (${h.n} đơn)`); });
  if(loss.length) items.push({lv:'bad',t:`Dòng bán dưới giá vốn: ${loss.join('; ')}`});
  if(thin.length) items.push({lv:'warn',t:`Dòng biên LN gộp dưới 5%: ${thin.join('; ')}`});
  if(noBuy.length) items.push({lv:'warn',t:`Dòng thuê ngoài chưa có giá mua (giá vốn = 0, P&L đang đẹp hơn thực tế): ${noBuy.join('; ')}`});
  if(hist.length) items.push({lv:'warn',t:`Giá mua lệch hơn 20% so với lịch sử: ${hist.join('; ')}`});
  const R=p.ref||{}; if(p.cpbanhang>0){ const bac=((CONFIG.cpTaiChinh||{})[R.hang]||{}).bac||[]; const below=bac.filter(b=>b.tu<=R.jr).at(-1);
    items.push({lv:R.jr>=0.2?'warn':'ok',t:`CPBH / giá vốn ${pct(R.jr)} (hạng ${R.hang}) → CP tài chính r = ${pct(R.rate)}${below?`; giảm CPBH dưới ${pct(below.tu)} giá vốn để về bậc thấp hơn`:''}`}); }
  const cn=dealCongNo(d); if(cn>30) items.push({lv:'warn',t:`Công nợ ${cn} ngày làm ngưỡng LN tăng thêm ${pct(Math.floor((cn-30)/15)*0.005)}`});
  if(d.donHangMoi==='Không'&&d.form.renew&&parseNum(d.form.renew.laigop_truoc)>0&&p.laigop_cuoi<parseNum(d.form.renew.laigop_truoc))
    items.push({lv:'warn',t:`LN thuần thấp hơn năm trước (${fmtB(parseNum(d.form.renew.laigop_truoc))}) — cần giải trình khi gửi duyệt`});
  const mis=d.lines.filter(l=>aicDiff(l,aiClassify(l).sug).some(x=>x[0]==='type')).length;
  if(mis) items.push({lv:'warn',t:`${mis} dòng có thể sai loại hàng — mở tab Danh mục › ✦ AI phân loại`});
  if(!ok){
    const t=(mut)=>{ const c=cloneDeal(d); mut(c); return plRatio(c); };
    const cp=p.cpbanhang;
    if(cp>0){ const v=bsearch(0,cp,x=>t(c=>c.form.cpbh=String(Math.floor(x))).ok,true);
      fixes.push(v!=null?{k:'cpbh',t:`Giảm CPBH từ ${fmtB(cp)} xuống ${fmtB(Math.floor(v/1e5)*1e5)}`,v:Math.floor(v/1e5)*1e5,res:t(c=>c.form.cpbh=String(Math.floor(v/1e5)*1e5))}
        :{k:'cpbh',t:`Bỏ toàn bộ CPBH (${fmtB(cp)}) vẫn chưa đạt`,na:true,res:t(c=>c.form.cpbh=0)}); }
    if(cn>30){ const rs=t(c=>c.form.congno='30 ngày'); fixes.push({k:'congno',t:`Rút công nợ từ ${cn} xuống 30 ngày (ngưỡng còn ${pct(rs.p.nguong)})`,res:rs,na:!rs.ok&&false}); }
    if(d.lines.some(l=>parseNum(l.discount)>0)){ const rs=t(c=>c.lines.forEach(l=>l.discount=0)); fixes.push({k:'disc',t:'Bỏ chiết khấu trên các dòng',res:rs}); }
    const thinIdx=d.lines.map((l,i)=>i).filter(i=>{ const l=d.lines[i], s=lineSell(l), b=lineBuy(l); return b>0&&s&&(s-b)/s<0.08; });
    if(thinIdx.length){ const v=bsearch(0,0.3,x=>t(c=>thinIdx.forEach(i=>c.lines[i].buy=Math.round(Number(c.lines[i].buy)*(1-x)))).ok,false);
      fixes.push(v!=null?{k:'buy',t:`Đàm phán giảm giá mua ${Math.ceil(v*1000)/10}% ở ${thinIdx.length} dòng biên mỏng (${thinIdx.map(i=>'#'+(i+1)).join(', ')})`,v:Math.ceil(v*1000)/1000,idx:thinIdx,res:t(c=>thinIdx.forEach(i=>c.lines[i].buy=Math.round(Number(c.lines[i].buy)*(1-Math.ceil(v*1000)/1000))))}
        :{k:'buy',t:`Giảm giá mua 30% ở các dòng biên mỏng vẫn chưa đạt`,na:true,res:t(c=>thinIdx.forEach(i=>c.lines[i].buy=Math.round(Number(c.lines[i].buy)*0.7)))}); }
    const v=bsearch(0,0.5,x=>t(c=>c.lines.forEach(l=>l.sell=Math.round(Number(l.sell)*(1+x)))).ok,false);
    if(v!=null) fixes.push({k:'sell',t:`Tăng giá bán đồng đều ${Math.ceil(v*1000)/10}% (doanh thu +${fmtB(p.doanhthu*Math.ceil(v*1000)/1000)})`,v:Math.ceil(v*1000)/1000,res:t(c=>c.lines.forEach(l=>l.sell=Math.round(Number(l.sell)*(1+Math.ceil(v*1000)/1000))))});
  }
  return {p,ok,r,items,fixes};
}
window.plFix=function(k){
  const d=activeDeal(); if(!wfEditable(d)) return; const c=plCheck(d), f=c.fixes.find(x=>x.k===k); if(!f) return;

};
